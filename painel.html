function salvarModelo(){
  var nome=document.getElementById('f_nome').value.trim();
  if(!nome){ document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">Nome obrigat\u00f3rio.</p>'; return; }
  var cats=(ST.dados&&ST.dados.acaiCategorias)||[];
  var limitesObj={};
  cats.forEach(function(cat){
    var nomeCat=cat.nome||cat.nome||'';
    var inMin=document.getElementById('lim_min_'+cat.id_categoria);
    var inMax=document.getElementById('lim_max_'+cat.id_categoria);
    if(!inMin||!inMax) return;
    var minV=parseInt(inMin.value)||0;
    var maxV=inMax.value.trim()===''?99:parseInt(inMax.value)||99;
    if(minV>0||maxV!==99) limitesObj[nomeCat]={min:minV,max:maxV};
  });
  var limitesJSON=Object.keys(limitesObj).length>0?JSON.stringify(limitesObj):'';
  var d={
    id_modelo:    document.getElementById('f_id').value,
    nome:         nome,
    descricao:    document.getElementById('f_desc').value.trim(),
    preco:        parseFloat(document.getElementById('f_preco').value)||0,
    ordem:        parseInt(document.getElementById('f_ordem').value)||0,
    limites_json: limitesJSON,
    foto_url:     document.getElementById('f_foto').value.trim(),
    disponivel:   (document.getElementById('f_disp').value==='true')
  };
  var btn=document.querySelector('#modalFormCrud .btn-primary');
  if(btn){ btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></div>Salvando...'; }
  api('POST', L('/acai-modelos'), d)
    .then(function(res){
      if(res.sucesso){ fecharModal('modalFormCrud'); toast(res.mensagem,'success'); recarregarMonteAcai(); }
      else{ document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">'+esc(res.mensagem)+'</p>'; if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar';} }
    })
    .catch(function(){ document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">Erro ao salvar. Tente novamente.</p>'; if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar';} });
}

function salvarConfiguracoes(){
  var dados={
    tipo_negocio:    document.getElementById('cfg_tipo_negocio') ? document.getElementById('cfg_tipo_negocio').value : 'outro',
    nome_loja:       document.getElementById('cfg_nome').value.trim(),
    texto_monte_acai: document.getElementById('cfg_texto_monte_acai') ? document.getElementById('cfg_texto_monte_acai').value.trim() : 'Monte seu Produto',
    whatsapp_numero: document.getElementById('cfg_wpp').value.trim(),
    horarios_dias: {
      dom: { abre: document.getElementById('cfg_h_abre_dom').value, fecha: document.getElementById('cfg_h_fecha_dom').value, fechado: document.getElementById('cfg_h_fechado_dom').checked },
      seg: { abre: document.getElementById('cfg_h_abre_seg').value, fecha: document.getElementById('cfg_h_fecha_seg').value, fechado: document.getElementById('cfg_h_fechado_seg').checked },
      ter: { abre: document.getElementById('cfg_h_abre_ter').value, fecha: document.getElementById('cfg_h_fecha_ter').value, fechado: document.getElementById('cfg_h_fechado_ter').checked },
      qua: { abre: document.getElementById('cfg_h_abre_qua').value, fecha: document.getElementById('cfg_h_fecha_qua').value, fechado: document.getElementById('cfg_h_fechado_qua').checked },
      qui: { abre: document.getElementById('cfg_h_abre_qui').value, fecha: document.getElementById('cfg_h_fecha_qui').value, fechado: document.getElementById('cfg_h_fechado_qui').checked },
      sex: { abre: document.getElementById('cfg_h_abre_sex').value, fecha: document.getElementById('cfg_h_fecha_sex').value, fechado: document.getElementById('cfg_h_fechado_sex').checked },
      sab: { abre: document.getElementById('cfg_h_abre_sab').value, fecha: document.getElementById('cfg_h_fecha_sab').value, fechado: document.getElementById('cfg_h_fechado_sab').checked }
    },
    status_loja:     document.getElementById('cfg_status').value,
    cor_loja:        document.getElementById('cfg_cor_loja') ? document.getElementById('cfg_cor_loja').value : '#000000',
    endereco_loja:   document.getElementById('cfg_end').value.trim(),
    preco_kg_dias: {
      dom: document.getElementById('cfg_p_dom').value,
      seg: document.getElementById('cfg_p_seg').value,
      ter: document.getElementById('cfg_p_ter').value,
      qua: document.getElementById('cfg_p_qua').value,
      qui: document.getElementById('cfg_p_qui').value,
      sex: document.getElementById('cfg_p_sex').value,
      sab: document.getElementById('cfg_p_sab').value
      },
    frete_gratis:    document.getElementById('cfg_frete_gratis') ? document.getElementById('cfg_frete_gratis').value : '0',
    tempo_entrega:   document.getElementById('cfg_tempo_entrega') ? document.getElementById('cfg_tempo_entrega').value.trim() : '',
    url_logo:        document.getElementById('cfg_logo').value.trim(),
    instagram_url:   document.getElementById('cfg_instagram') ? document.getElementById('cfg_instagram').value.trim() : '',
    whatsapp_link:   document.getElementById('cfg_wpp_link')  ? document.getElementById('cfg_wpp_link').value.trim()  : '',
    facebook_url:        document.getElementById('cfg_facebook') ? document.getElementById('cfg_facebook').value.trim() : '',
    retirada_loja_ativo: document.getElementById('cfg_retirada')  ? (document.getElementById('cfg_retirada').value==='true') : false,
    autoimprimir_balcao: document.getElementById('cfg_print_balcao') ? (document.getElementById('cfg_print_balcao').value==='true') : false,
    autoimprimir_delivery: document.getElementById('cfg_print_delivery') ? (document.getElementById('cfg_print_delivery').value==='true') : false,
    mostrar_acai_rapido_pdv: document.getElementById('cfg_acai_rapido') ? (document.getElementById('cfg_acai_rapido').value==='true') : false,
    pix_modo:            document.getElementById('cfg_pix_modo')   ? document.getElementById('cfg_pix_modo').value   : 'MANUAL',
    mp_access_token:      document.getElementById('cfg_mp_token')   ? document.getElementById('cfg_mp_token').value   : ''
  };
  var msg=document.getElementById('cfgMsg');
  msg.innerHTML='<div class="flex items-center gap-2 text-muted text-sm"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div>Salvando...</div>';
  api('POST', L('/configuracoes'), dados)
    .then(function(res){
      if(res.sucesso){
        msg.innerHTML='<p class="text-sm text-green"><i class="fa-solid fa-check"></i> '+esc(res.mensagem)+'</p>';
        toast('Configurações salvas!','success');
        // ★ Atualiza o estado local imediatamente sem precisar recarregar
        if(!ST.dados) ST.dados={};
        if(!ST.dados.configuracoes) ST.dados.configuracoes={};
        for(var k in dados){ ST.dados.configuracoes[k]=dados[k]; }
        // Atualiza logo na sidebar
        var logoEl=document.getElementById('sidebarLogoIcon');
        if(logoEl && dados.url_logo){
          logoEl.innerHTML='<img src="'+dados.url_logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.parentElement.innerHTML=\'🍇\'">';
          logoEl.style.background='none';
        }
        // Atualiza nome da loja na sidebar
        var nmEl=document.getElementById('sidebarLogoText');
        if(nmEl && dados.nome_loja) nmEl.innerHTML=esc(dados.nome_loja)+'<br><span style="font-size:10px;opacity:.6">Painel de Controle</span>';
        // Re-renderiza o card de configurações com os novos valores
        var body=document.getElementById('configLojaBody');
        if(body) body.innerHTML=renderConfigLoja();
      } else {
        msg.innerHTML='<p class="text-sm text-red">'+esc(res.mensagem)+'</p>';
      }
    })
    .catch(function(e){ msg.innerHTML='<p class="text-sm text-red">Erro: '+esc(e)+'</p>'; });
}

function abrirFormTara(id){

  document.getElementById('modalFormTitle').innerHTML='<i class="fa-solid fa-weight-scale"></i> '+(d?'Editar Tara':'Nova Tara');

    '<div class="form-row cols-2">'+
      fGroup('Nome da Vasilha *','f_nome','text',d?d.nome:'','Ex: Pote 500ml')+
      fGroup('Peso da Tara (g) *','f_gramas','number',d?d.gramas:'','Ex: 85')+
    '</div>'+
    fGroup('URL da Foto (opcional)','f_foto','url',d?d.foto_url:'','https://...')+

function salvarTaraForm(){
  var nome   = document.getElementById('f_nome').value.trim();
  var gramas = parseFloat(document.getElementById('f_gramas').value)||0;
  var msgEl  = document.getElementById('formMsg');
  if(!nome)  { msgEl.innerHTML='<p class="text-sm text-red">Nome obrigatório.</p>'; return; }
  if(!gramas){ msgEl.innerHTML='<p class="text-sm text-red">Peso em gramas obrigatório.</p>'; return; }
  var dados={
    id_tara:   document.getElementById('f_id').value,
    nome: nome, gramas: gramas,
    foto_url:  document.getElementById('f_foto').value.trim(),
    ativo:     (document.getElementById('f_ativo').value==='true')
  };
  var btn=document.querySelector('#modalFormCrud .btn-primary');
  if(btn){ btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></div>Salvando...'; }
  api('POST', L('/taras'), dados)
    .then(function(res){
      if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar'; }
      if(res.sucesso){
        fecharModal('modalFormCrud'); toast(res.mensagem,'success');
        api('GET', L('/taras'))
          .then(function(novas){
            if(ST.dados) ST.dados.taras=novas;
            var t=document.getElementById('tbodyTaras');
            if(t) t.innerHTML=renderTarasRows();
          })
          .catch(function(){});
      } else {
        if(msgEl) msgEl.innerHTML='<p class="text-sm text-red">'+esc(res.mensagem)+'</p>';
      }
    })
    .catch(function(e){
      if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar'; }
      if(msgEl) msgEl.innerHTML='<p class="text-sm text-red">Erro: '+esc(e)+'</p>';
    });
}

function salvarUsuarioForm(){
  var id=document.getElementById('f_id').value;
  var senhaDigitada=document.getElementById('f_senha').value;
  var senhaAnterior='';
  if(id){
    var uAnterior=((ST.dados&&ST.dados.usuarios)||[]).find(function(x){ return x.id_usuario===id; });
    if(uAnterior) senhaAnterior=uAnterior.senha||'';
  }
  var d={id_usuario:id,nome:document.getElementById('f_nome').value.trim(),login:document.getElementById('f_login').value.trim(),senha:senhaDigitada||senhaAnterior,cargo:document.getElementById('f_cargo').value,status:document.getElementById('f_status').value,foto_perfil:document.getElementById('f_foto_perfil').value.trim()};
  if(!d.nome||!d.login){ document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">Nome e login são obrigatórios.</p>'; return; }
  if(!d.senha){ document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">Senha obrigatória para novos usuários.</p>'; return; }
  api('POST', L('/usuarios'), d).then(function(res){ 
        if(res.sucesso){ 
          fecharModal('modalFormCrud'); 
          toast(res.mensagem,'success'); 
          // Recarrega o banco e atualiza a barra lateral na hora
          api('GET', L('/dados-config')).then(function(dados){
            if(ST.dados) { ST.dados.usuarios = dados.usuarios || []; }
            construirUI();
            renderSecaoConfig();
          });
        } else {
          document.getElementById('formMsg').innerHTML='<p class="text-sm text-red">'+esc(res.mensagem)+'</p>';

// ── Atalhos de teclado ──────────────────────────────────────
// F2 = Abrir Balcão  |  F3 = Abrir Delivery  |  F6 = Adicionar Açaí (modal Balcão)  |  Esc = Fechar modal
document.addEventListener('keydown', function(e){
  var tag=(document.activeElement&&document.activeElement.tagName)||'';

  // F4 e F5 funcionam mesmo com campo focado (finalizar venda)
  if(e.key==='F6'){
    e.preventDefault();
    var mBalcaoF6=document.getElementById('modalBalcao');
    if(mBalcaoF6&&mBalcaoF6.classList.contains('open')) adicionarAcaiBalcao();
    return;
  }
  if(e.key==='F4'){
    e.preventDefault();
    var mBalcao=document.getElementById('modalBalcao');
    if(mBalcao&&mBalcao.classList.contains('open')) finalizarBalcao();
    return;
  }
  if(e.key==='F5'){
    e.preventDefault();
    var mDel=document.getElementById('modalDeliveryPDV');
    if(mDel&&mDel.classList.contains('open')) finalizarDeliveryPDV();
    return;
  }

  // Enter dentro dos modais PDV — atalhos de produtividade
  if(e.key==='Enter'){
    var mBalcaoOpen = document.getElementById('modalBalcao')&&document.getElementById('modalBalcao').classList.contains('open');
    var mDelOpen    = document.getElementById('modalDeliveryPDV')&&document.getElementById('modalDeliveryPDV').classList.contains('open');

    // Se o campo ativo é o de peso bruto, avança para campo valor pago
    if(mBalcaoOpen && document.activeElement && document.activeElement.id==='b_pesoBruto'){
      e.preventDefault();
      var vp=document.getElementById('b_valorPago');
      if(vp){ vp.focus(); vp.select(); }
      return;
    }
    // Se o campo ativo é o de valor pago no balcão, finaliza
    if(mBalcaoOpen && document.activeElement && document.activeElement.id==='b_valorPago'){
      e.preventDefault();
      finalizarBalcao();
      return;
    }
    // Se o campo ativo é valor pago no delivery, finaliza
    if(mDelOpen && document.activeElement && document.activeElement.id==='d_valorPago'){
      e.preventDefault();
      finalizarDeliveryPDV();
      return;
    }
  }

  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  // 1/2/3 = selecionam pagamento quando modal PDV estiver aberto e sem campo ativo
  var mBOpen = document.getElementById('modalBalcao')&&document.getElementById('modalBalcao').classList.contains('open');
  var mDOpen = document.getElementById('modalDeliveryPDV')&&document.getElementById('modalDeliveryPDV').classList.contains('open');
  if((mBOpen||mDOpen)&&(e.key==='1'||e.key==='2'||e.key==='3')){
    e.preventDefault();
    var grupo = mBOpen ? 'b_pgto' : 'd_pgto';
    var mapa  = {'1':'PIX','2':'CARTAO','3':'DINHEIRO'};
    selecionarPgto(grupo, mapa[e.key]);
    return;
  }

  if(e.key==='F2'){
    e.preventDefault();
    if(typeof abrirPDVBalcao==='function' && ST.abaAtiva==='abaPedidos') abrirPDVBalcao();
  }
  if(e.key==='F3'){
    e.preventDefault();
    if(typeof abrirPDVDelivery==='function' && ST.abaAtiva==='abaPedidos') abrirPDVDelivery();
  }
  if(e.key==='Escape'){
    var abertos=document.querySelectorAll('.modal-overlay.open');
    if(abertos.length){
      var ultimo=abertos[abertos.length-1];
      var btn=ultimo.querySelector('.modal-close');
      if(btn) btn.click();
    }
  }
});

// -- FUNÇÕES GLOBAIS DE IMPRESSÃO E CARTEIRA --
function imprimirCupomBusca(id) {
    var p = null;
    if(ST.dados && ST.dados.pedidosDia) p = ST.dados.pedidosDia.pedidos.find(function(x){return x.id_venda === id;});
    if(!p && ST.dados && ST.dados.deliveryAtivo) p = ST.dados.deliveryAtivo.find(function(x){return x.id_venda === id;});
    if(!p && window._relatorioAtual) p = window._relatorioAtual.find(function(x){return x.id_venda === id;});
    
    if(p) imprimirCupom(p);
    else toast('Pedido não encontrado para impressão.', 'error');
}

function imprimirCupom(pedido) {
    if(!pedido) return;
    var janela = window.open('', '_blank', 'width=320,height=600');
    var cli = parseCliente(pedido.cliente_info);
    var itens = parseItens(pedido.itens_comprados);
    var dataHora = pedido.data_hora || '--';
    var cfg = ST.dados.configuracoes || {};
    
    // Captura os dados do seu sistema de forma limpa
    var logoHTML = cfg.url_logo ? '<img src="' + cfg.url_logo + '" style="max-width:90px; max-height:90px; border-radius:12px; margin:0 auto 10px; display:block; filter: grayscale(100%);">' : '';
    var nomeLoja = cfg.nome_loja || 'Nossa Loja';
    var telHTML = cfg.whatsapp_numero ? '<div style="margin-top:2px;">📱 ' + cfg.whatsapp_numero + '</div>' : '';
    var endHTML = cfg.endereco_loja ? '<div style="margin-top:4px;">📍 ' + cfg.endereco_loja + '</div>' : '';
    var insta = cfg.instagram_url ? cfg.instagram_url.replace(/\/$/, '').split('/').pop() : '';
    var instaHTML = insta ? '<div style="margin-top:4px;">📸 @' + insta + '</div>' : '';

    // Estilo preparado para Bobina Térmica
    var html = '<html><head><title>Cupom</title><style>body{font-family:"Courier New", Courier, monospace;width:300px;margin:0 auto;padding:15px 10px;color:#000;font-size:13px;line-height:1.4;} .center{text-align:center;} .linha{border-bottom:1px dashed #000;margin:12px 0;} .flex{display:flex;justify-content:space-between;align-items:flex-end;} .bold{font-weight:bold;} .badge{border: 1px solid #000; padding:2px 6px; border-radius:4px; font-size:11px;} @media print { body { width: 100%; margin: 0; padding: 0; } }</style></head><body>';
    
    // --- Cabeçalho da Loja ---
    html += '<div class="center">' + logoHTML + '<h2 style="margin:0 0 5px;font-size:18px;">' + nomeLoja + '</h2>' + telHTML + endHTML + instaHTML + '</div>';
    html += '<div class="linha"></div>';
    
    // --- Dados do Pedido ---
    html += '<h2 class="center" style="margin:5px 0;font-size:22px;">PEDIDO: #' + (pedido.id_venda||'') + '</h2>';
    html += '<div class="center" style="font-size:11px;margin-bottom:12px;">' + dataHora + '</div>';
    
    html += '<div>';
    if(cli.nome) html += '<div class="bold">👤 ' + cli.nome + '</div>';
    if(cli.telefone) html += '<div>📞 ' + cli.telefone + '</div>';
    if(cli.endereco) html += '<div style="margin-top:4px;">🚚 ' + cli.endereco + '</div>';
    html += '<div style="margin-top:6px;">📍 Origem: <span class="badge">' + (pedido.origem||'--') + '</span></div>';
    html += '</div><div class="linha"></div>';
    
    // --- Lista de Itens ---
    html += '<div class="bold" style="margin-bottom:8px; font-size:14px;">RESUMO DO PEDIDO:</div>';
    itens.forEach(function(i) {
        html += '<div class="flex bold" style="margin-top:6px;"><span>• ' + (i.descricao||i.nome||'') + '</span><span>' + fmtMoeda(i.preco) + '</span></div>';
        if(i.detalhes) html += '<div style="font-size:11px;color:#333;margin-left:12px;margin-bottom:2px;">↳ ' + i.detalhes + '</div>';
    });
    
    html += '<div class="linha"></div>';
    
    // --- Fechamento de Valores ---
    if(parseFloat(pedido.subtotal||0) > 0) html += '<div class="flex"><span>Subtotal:</span><span>' + fmtMoeda(pedido.subtotal) + '</span></div>';
    if(parseFloat(pedido.desconto||0) > 0) html += '<div class="flex"><span>Desconto:</span><span>-' + fmtMoeda(pedido.desconto) + '</span></div>';
    if(parseFloat(pedido.taxa_entrega||0) > 0) html += '<div class="flex"><span>Taxa Entrega:</span><span>' + fmtMoeda(pedido.taxa_entrega) + '</span></div>';
    
    html += '<div class="linha"></div>';
    html += '<div class="flex bold" style="font-size:17px; background:#000; color:#fff; padding: 4px;"><span>TOTAL:</span><span>' + fmtMoeda(pedido.total_final) + '</span></div>';
    
    // --- Pagamento ---
    html += '<div class="linha"></div>';
    html += '<div class="center">Forma de Pagamento:<br><span class="bold" style="font-size:15px; text-transform:uppercase;">' + (pedido.metodo_pagamento||'--') + '</span></div>';
    
    // --- Rodapé ---
    html += '<div class="linha"></div>';
    html += '<div class="center" style="font-size:11px;margin-top:15px;">Desenvolvido por <b>AlyxSoftwares</b><br>Obrigado pela preferência! ❤️</div>';
    
    html += '</body></html>';
    
    janela.document.write(html);
    janela.document.close();
    janela.focus();
    setTimeout(function(){ janela.print(); janela.close(); }, 800);
}

function abrirCarteiraEntregador() {
    var ativos = (ST.dados && ST.dados.deliveryAtivo) || [];
    var concluidos = (ST.dados && ST.dados.pedidosDia && ST.dados.pedidosDia.pedidos) || [];
    var todosPedidos = concluidos.concat(ativos);
    
    // Remove duplicados caso existam nas duas listas
    var map = {};
    var unicos = todosPedidos.filter(function(p) { if(map[p.id_venda]) return false; map[p.id_venda]=true; return true; });

    var minhasEntregas = unicos.filter(function(p) {
                var st = (p.status||'').toUpperCase();
                var origem = (p.origem||'').toUpperCase();
                
                // Usa estritamente o nome do Entregador (evita puxar o Operador do caixa por engano)
                var entregador = (p.entregador_nome || '').toLowerCase().trim();
                var meuNome = (ST.usuario.nome || '').toLowerCase().trim();
                
                // Aceita as entregas lançadas no PDV (DELIVERY) e as que vieram do App (ONLINE)
                return st === 'ENTREGUE' && (origem === 'DELIVERY' || origem === 'ONLINE') && entregador === meuNome;
            });

    var totalTaxas = minhasEntregas.reduce(function(sum, p) { return sum + parseFloat(p.taxa_entrega||0); }, 0);
    var html = '<div class="stat-grid mb-4"><div class="stat-card stat-green" style="padding:16px;"><div class="stat-icon" style="margin-bottom:8px;"><i class="fa-solid fa-money-bill-wave"></i></div><div class="stat-label">Total em Taxas (Hoje)</div><div class="stat-value">' + fmtMoeda(totalTaxas) + '</div><div class="stat-sub">' + minhasEntregas.length + ' entregas concluídas</div></div></div>';

    if(!minhasEntregas.length) {
        html += '<div class="empty-state"><i class="fa-solid fa-wallet"></i><p>Nenhuma entrega concluída hoje ainda.</p></div>';
    } else {
        html += '<div style="display:grid;gap:12px;max-height:50vh;overflow-y:auto;padding-right:5px;">' + minhasEntregas.map(function(p){
            var cli = parseCliente(p.cliente_info);
            return '<div class="pedido-card" style="margin:0;"><div class="pedido-card-header" style="margin:0;"><div><div class="pedido-card-id">' + esc(p.id_venda) + '</div><div class="pedido-card-cliente">' + esc(cli.nome||'Cliente') + '</div><div class="pedido-card-hora"><i class="fa-regular fa-clock"></i> ' + esc(fmtHora(p.data_hora)) + '</div></div><div><span class="badge badge-entregue">Taxa: ' + fmtMoeda(p.taxa_entrega) + '</span></div></div></div>';
        }).join('') + '</div>';
    }

    document.getElementById('modalFormTitle').innerHTML = '<i class="fa-solid fa-wallet text-green"></i> Minha Carteira (Hoje)';
    document.getElementById('modalFormBody').innerHTML = html;
    document.getElementById('modalFormFooter').innerHTML = '<button class="btn btn-secondary" onclick="fecharModal(\'modalFormCrud\')">Fechar</button>';
    abrirModal('modalFormCrud');
}
