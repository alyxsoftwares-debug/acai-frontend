<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="logo-alyx.png">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Painel — AlyxSoftwares</title>
<link rel="apple-touch-icon" href="logo-alyx.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
    });
    
    // Força a janela do navegador perguntando se o usuário quer receber notificações
    OneSignal.Slidedown.promptPush();

    // Associa o celular à loja e informa o cargo para isolar notificações
    try {
      var s = JSON.parse(sessionStorage.getItem('pdacai_user') || '{}');
      if (s.loja_id) {
        OneSignal.User.addTags({
          loja_id: s.loja_id,
          cargo: s.cargo || 'Operador'
        });
      }
    } catch(e) {}
  });
</script>

<style>
  @media(max-width:600px){
  .modal-box{max-height:95dvh;overflow-y:auto;margin:2.5dvh auto}
  .pdv-grid{gap:12px}
  .form-row.cols-2{grid-template-columns:1fr}
}
@media(max-width:360px){
  #sidebar.collapsed .sidebar-bottom{ display:none; }
  .sidebar-bottom span, .sidebar-bottom a{ font-size:9px; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f0f2f5;color:#0f172a;min-height:100vh;overflow-x:hidden}
:root{
  --brand-50:#f5f3ff;--brand-100:#ede9fe;--brand-200:#ddd6fe;--brand-300:#c4b5fd;
  --brand-400:#a78bfa;--brand-500:#8b5cf6;--brand-600:#7c3aed;--brand-700:#6d28d9;
  --brand-800:#5b21b6;--brand-900:#4c1d95;
  --grad-main:linear-gradient(160deg,#1a0533 0%,#2d0f5e 60%,#1a0533 100%);
  --grad-btn:linear-gradient(135deg,#7c3aed,#a855f7);
  --shadow-card:0 4px 24px rgba(109,40,217,.10);
  --shadow-btn:0 4px 16px rgba(124,58,237,.35);
  --radius:16px;--radius-sm:10px;
  --sidebar-w:256px;
  --topbar-h:64px;
}

/* ── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}

/* ── Layout ─────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--grad-main);
  display:flex;flex-direction:column;height:100vh;
  transition:width .3s cubic-bezier(.4,0,.2,1);position:relative;z-index:100;
  box-shadow:4px 0 32px rgba(0,0,0,.22);
}
#sidebar.collapsed{width:68px;min-width:68px}
.sidebar-logo{
  padding:22px 16px 18px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.sidebar-logo .logo-icon{
  width:38px;height:38px;background:linear-gradient(135deg,#a855f7,#ec4899);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;box-shadow:0 2px 12px rgba(168,85,247,.4);
}
.sidebar-logo .logo-text{color:#fff;font-weight:800;font-size:13.5px;line-height:1.35;
  white-space:nowrap;overflow:hidden;transition:opacity .2s,width .3s}
#sidebar.collapsed .logo-text{opacity:0;width:0;overflow:hidden}
.sidebar-user{
  padding:12px 16px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.user-avatar{
  width:34px;height:34px;background:linear-gradient(135deg,#7c3aed,#a855f7);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(124,58,237,.4);
}
.user-avatar img{
  width:100%;height:100%;object-fit:cover;
  border-radius:50%;display:block;
}
.user-info{overflow:hidden;transition:opacity .2s,width .3s;min-width:0}
.user-info .name{color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info .cargo-badge{
  display:inline-block;background:rgba(255,255,255,.12);color:rgba(255,255,255,.75);
  font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px;
  letter-spacing:.3px;text-transform:uppercase;
}
#sidebar.collapsed .user-info{opacity:0;width:0;overflow:hidden}

nav.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0;scrollbar-width:none}
nav.sidebar-nav::-webkit-scrollbar{display:none}
nav.sidebar-nav a{
  display:flex;align-items:center;gap:12px;padding:9px 10px;
  margin:1px 8px;border-radius:10px;
  color:rgba(255,255,255,.55);text-decoration:none;font-weight:600;font-size:13px;
  transition:all .18s;cursor:pointer;white-space:nowrap;
}
nav.sidebar-nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
nav.sidebar-nav a.active{
  color:#fff;background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
nav.sidebar-nav a i{font-size:15px;width:20px;text-align:center;flex-shrink:0;opacity:.85}
nav.sidebar-nav a.active i{opacity:1}
nav.sidebar-nav .nav-label{overflow:hidden;transition:opacity .2s,width .3s}
#sidebar.collapsed nav.sidebar-nav .nav-label{opacity:0;width:0;overflow:hidden}
nav.sidebar-nav .nav-sep{height:1px;background:rgba(255,255,255,.06);margin:6px 18px}

.sidebar-bottom{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07)}
#sidebar.collapsed .sidebar-bottom .nav-label,
#sidebar.collapsed .sidebar-bottom span,
#sidebar.collapsed .sidebar-bottom a{opacity:0;width:0;overflow:hidden;display:none}
#sidebar.collapsed .sidebar-bottom{padding:10px 0;display:flex;align-items:center;justify-content:center}
#sidebar.collapsed .btn-logout{justify-content:center;padding:8px}
.btn-logout{
  display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.45);
  background:none;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;
  font-weight:600;width:100%;padding:7px 0;transition:color .18s;border-radius:8px;
}
.btn-logout:hover{color:#f87171}
.btn-collapse{
  position:absolute;top:50%;right:-13px;transform:translateY(-50%);
  width:26px;height:26px;background:var(--grad-btn);border:2px solid #f8f4ff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;transition:all .2s;box-shadow:0 2px 8px rgba(124,58,237,.4);
}
.btn-collapse:hover{transform:translateY(-50%) scale(1.1)}
.btn-collapse i{color:#fff;font-size:10px;transition:transform .3s}
#sidebar.collapsed .btn-collapse i{transform:rotate(180deg)}

/* ── Main ───────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;background:#f0f2f5}
.top-bar{
  background:#fff;padding:0 28px;height:var(--topbar-h);display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid #e8ecf0;
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 #e8ecf0;
}
.top-bar h1{font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-.025em;line-height:1}
.top-bar p{color:#94a3b8;font-size:12.5px;margin-top:3px;font-weight:500}
.top-bar-actions{display:flex;align-items:center;gap:10px}
.btn-refresh{
  width:36px;height:36px;border-radius:9px;border:1.5px solid #e8ecf0;
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#7c3aed;transition:all .18s;
}
.btn-refresh:hover{background:#f5f3ff;border-color:#c4b5fd}

.page-content{flex:1;padding:22px 28px}

/* ── Cards ──────────────────────────────────────────── */
.card{
  background:#fff;border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04);
  border:1px solid #e8ecf0;
}
.card-header{
  padding:15px 20px;border-bottom:1px solid #f3f4f6;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-weight:800;font-size:14.5px;color:#0f172a;display:flex;align-items:center;gap:10px}
.card-title .icon{
  width:30px;height:30px;border-radius:8px;background:var(--brand-100);
  display:flex;align-items:center;justify-content:center;color:#7c3aed;font-size:13px;
}
.card-body{padding:18px}

/* ── Buttons ────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;
  border-radius:9px;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:13px;transition:all .18s;text-decoration:none;
  letter-spacing:-.01em;
}
.btn-primary{background:var(--grad-btn);color:#fff;box-shadow:0 2px 10px rgba(124,58,237,.3)}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,.4)}
.btn-secondary{background:#f5f3ff;color:#7c3aed;border:1.5px solid #e8e3fc}
.btn-secondary:hover{background:#ede9fe;border-color:#c4b5fd}
.btn-danger{background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#f0fdf4;color:#16a34a;border:1.5px solid #bbf7d0}
.btn-success:hover{background:#dcfce7}
.btn-warning{background:#fffbeb;color:#d97706;border:1.5px solid #fde68a}
.btn-warning:hover{background:#fef3c7}
.btn-dark{background:#1e293b;color:#fff;border:none}
.btn-dark:hover{background:#0f172a}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;transform:none!important}

/* ── Badges ─────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:99px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;
}
.badge-novo{background:#dbeafe;color:#1d4ed8}
.badge-preparando{background:#ffedd5;color:#c2410c}
.badge-em_montagem{background:#f3e8ff;color:#7e22ce}
.badge-a_caminho{background:#fef9c3;color:#854d0e}
.badge-pronto{background:#dcfce7;color:#15803d}
.badge-entregue{background:#dcfce7;color:#15803d}
.badge-cancelado{background:#fee2e2;color:#b91c1c}
.badge-online{background:#dbeafe;color:#1d4ed8}
.badge-balcao{background:#ede9fe;color:#6d28d9}
.badge-delivery{background:#ffedd5;color:#c2410c}

/* ── Config Tabs ─────────────────────────────────────── */
.cfg-tabs-nav{
  display:flex;border-bottom:1px solid #f0f2f5;
  padding:0 20px;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.cfg-tabs-nav::-webkit-scrollbar{display:none}
.cfg-tab-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:10px 13px;font-size:11.5px;font-weight:700;
  color:#9ca3af;border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .18s,border-color .18s;font-family:inherit;
  margin-bottom:-1px;
}
.cfg-tab-btn i{font-size:11px}
.cfg-tab-btn:hover{color:#7c3aed}
.cfg-tab-btn.cfg-tab-ativo{color:#7c3aed;border-bottom-color:#7c3aed}
.cfg-panel{display:none}
.cfg-panel-ativo{display:block}

/* ── Help Tooltip ────────────────────────────────────── */
.cfg-help{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;
  background:#ede9fe;color:#7c3aed;
  font-size:9px;font-weight:900;cursor:default;
  margin-left:4px;vertical-align:middle;
  position:relative;line-height:1;
  border:1px solid #ddd6fe;
}
.cfg-help::before{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);
  background:#1e1b4b;color:#fff;font-size:11px;font-weight:500;
  padding:7px 11px;border-radius:9px;
  white-space:pre-wrap;text-align:left;line-height:1.5;
  min-width:180px;max-width:260px;
  pointer-events:none;opacity:0;transition:opacity .15s;
  z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.22);
  text-transform:none;letter-spacing:0;
}
.cfg-help::after{
  content:'';position:absolute;bottom:calc(100% + 2px);left:50%;
  transform:translateX(-50%);border:5px solid transparent;
  border-top:5px solid #1e1b4b;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9999;
}
.cfg-help:hover::before,.cfg-help:hover::after{opacity:1}

/* ── Config Section Title ────────────────────────────── */
.cfg-section-title{
  font-size:10px;font-weight:800;color:#94a3b8;
  text-transform:uppercase;letter-spacing:.7px;
  margin:22px 0 14px;padding-bottom:8px;
  border-bottom:1px solid #f0f2f5;
  display:flex;align-items:center;gap:7px;
}
.cfg-section-title i{color:#a78bfa;font-size:12px}

/* ── Form ───────────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.form-control{
  width:100%;padding:9px 13px;border:1.5px solid #e2e8f0;border-radius:10px;
  font-family:inherit;font-size:13.5px;color:#0f172a;background:#fff;
  transition:border-color .18s,box-shadow .18s;outline:none;
}
.form-control:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.form-control:disabled{background:#f8fafc;color:#94a3b8}
select.form-control{cursor:pointer}
.form-row{display:grid;gap:14px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}

/* ── Modal ──────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,5,30,.7);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(6px);
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:#fff;border-radius:20px;width:100%;max-width:580px;
  max-height:92vh;overflow-y:auto;
  transform:translateY(20px) scale(.98);transition:transform .22s cubic-bezier(.34,1.2,.64,1);
  box-shadow:0 24px 80px rgba(0,0,0,.22);
}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1)}
.modal-box.modal-lg{max-width:780px}
.modal-box.modal-xl{max-width:1000px}
/* PDV modal — ocupa quase toda a tela com layout interno que não scrolle */
.modal-box.modal-pdv{
  max-width:1180px;max-height:calc(100vh - 32px);
  display:flex;flex-direction:column;overflow:hidden;
}
.modal-box.modal-pdv .modal-body{
  flex:1;overflow:hidden;padding:0;
  display:flex;flex-direction:column;
}
.modal-header{
  padding:16px 22px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #f0f2f5;flex-shrink:0;
  background:#fff;border-radius:20px 20px 0 0;
}
.modal-title{font-weight:800;font-size:16px;color:#1e1b4b;display:flex;align-items:center;gap:10px}
.modal-close{
  width:30px;height:30px;border-radius:8px;border:1.5px solid #e5e7eb;
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#6b7280;font-size:15px;transition:all .18s;
}
.modal-close:hover{background:#fef2f2;border-color:#fecaca;color:#ef4444}
.modal-body{padding:22px}
.modal-footer{
  padding:14px 22px;border-top:1px solid #f0f2f5;
  display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;
}

/* ── Stat Cards ─────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:18px 20px;
  border:1px solid #e8ecf0;box-shadow:0 1px 4px rgba(0,0,0,.04);
  border-left:3px solid #e8ecf0;transition:box-shadow .18s,border-left-color .18s;
}
.stat-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.stat-card .stat-label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px}
.stat-card .stat-value{font-size:26px;font-weight:900;color:#0f172a;margin-top:4px;line-height:1;letter-spacing:-.03em}
.stat-card .stat-sub{font-size:11.5px;color:#94a3b8;margin-top:4px}
.stat-card .stat-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-bottom:10px;
}
.stat-purple .stat-icon{background:#f5f3ff;color:#7c3aed}
.stat-green  .stat-icon{background:#f0fdf4;color:#16a34a}
.stat-orange .stat-icon{background:#fff7ed;color:#f97316}
.stat-blue   .stat-icon{background:#eff6ff;color:#3b82f6}
.stat-pink   .stat-icon{background:#fdf2f8;color:#ec4899}
.stat-purple{border-left-color:#7c3aed}
.stat-green {border-left-color:#16a34a}
.stat-orange{border-left-color:#f97316}
.stat-blue  {border-left-color:#3b82f6}
.stat-pink  {border-left-color:#ec4899}

/* ── Tabela ─────────────────────────────────────────── */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{
  background:#f8fafc;padding:9px 14px;text-align:left;
  font-size:10.5px;font-weight:800;color:#64748b;text-transform:uppercase;
  letter-spacing:.6px;border-bottom:2px solid #e8ecf0;white-space:nowrap;
}
table.tbl td{
  padding:12px 14px;border-bottom:1px solid #f0f2f5;
  font-size:13px;color:#334155;vertical-align:middle;
}
table.tbl tr:hover td{background:#f8fafc}
table.tbl tr:last-child td{border-bottom:none}

/* ── PDV ─────────────────────────────────────────────── */
.pdv-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;height:calc(100vh - 160px)}
.pdv-left{overflow-y:auto}
.pdv-right{overflow-y:auto}

/* ── PDV 3 colunas (dentro do modal) ─────────────────── */
.pdv-3col{
  display:grid;
  grid-template-columns:340px 1fr 320px;
  height:100%;
  gap:0;
  overflow:hidden;
}
.pdv-col{
  display:flex;flex-direction:column;
  border-right:1px solid #f0f2f5;
  overflow:hidden;
}
.pdv-col:last-child{border-right:none}
.pdv-col-header{
  padding:14px 18px;
  border-bottom:1px solid #f0f2f5;
  flex-shrink:0;background:#fff;
}
.pdv-col-header h3{
  font-size:12px;font-weight:800;color:#64748b;
  text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;gap:7px;
}
.pdv-col-header h3 i{font-size:13px;color:#7c3aed}
.pdv-col-body{
  flex:1;overflow-y:auto;padding:14px 16px;
}

/* ── PDV Peso Display ─────────────────────────────────── */
.peso-display{
  background:linear-gradient(135deg,#f8f4ff,#ede9fe);
  border:1px solid #ddd6fe;border-radius:12px;
  padding:14px 16px;margin-bottom:14px;
  text-align:center;
}
.peso-display .lbl{font-size:10px;font-weight:800;color:#7c3aed;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.peso-display .valor{font-size:32px;font-weight:900;color:#1e1b4b;line-height:1;font-variant-numeric:tabular-nums}
.peso-display .preco{font-size:14px;font-weight:700;color:#7c3aed;margin-top:4px}

/* ── PDV Atalhos Rápidos ─────────────────────────────── */
.pdv-atalhos{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
}
.pdv-atalho-btn{
  padding:10px 6px;border-radius:10px;border:1.5px solid #e8ecf0;
  background:#fff;cursor:pointer;font-family:inherit;text-align:center;
  transition:all .15s;line-height:1.3;
}
.pdv-atalho-btn:hover{border-color:#7c3aed;background:#f5f3ff;transform:translateY(-1px)}
.pdv-atalho-btn .nome{font-size:11px;font-weight:800;color:#1e1b4b;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>

// ═══ CONFIGURAÇÃO DA API ════════════════════════════════════════════════════
// Altere API_URL para a URL real do seu backend no Render após o deploy.
var API_URL = 'https://alyxsoftwares-acaiteria.onrender.com'; // ← URL do seu backend no Render
var ONESIGNAL_APP_ID = 'c7565fa8-cd8c-4264-85b4-1a9d9cf150af';

// ─── ID da loja lido da sessão (salvo pelo login.html) ─────────────────────
var LOJA_ID = (function(){
  try{ var s=JSON.parse(sessionStorage.getItem('pdacai_user')||'{}'); return s.loja_id||''; }catch(e){ return ''; }
})();

/** Monta o path multitenant: L('/pedidos') → '/api/lojas/{loja_id}/pedidos' */
function L(path){ return '/api/lojas/'+LOJA_ID+path; }

/**
 * Wrapper fetch — comunicação com a API do backend.
 * @param {string} method  GET | POST | PATCH | DELETE
 * @param {string} path    ex: '/api/pedidos/dia'
 * @param {Object} [body]  payload JSON (omitido em GET/DELETE por id via path)
 * @returns {Promise<any>}
 */
function api(method, path, body) {
  var sessao = JSON.parse(sessionStorage.getItem('pdacai_user') || '{}');
  var controller = new AbortController();
  var tid = setTimeout(function() { controller.abort(); }, 25000);
  
  var urlFinal = API_URL + path;
  if (method === 'GET') {
      var sep = urlFinal.indexOf('?') === -1 ? '?' : '&';
      urlFinal += sep + 'v=' + Date.now();
  }

  var opts = {
    method:  method,
    headers: {
      'Content-Type':  'application/json',
      'Authorization': sessao.token ? 'Bearer ' + sessao.token : ''
    },
    signal: controller.signal
  };
  if (body !== undefined && method !== 'GET') opts.body = JSON.stringify(body);
  return fetch(urlFinal, opts)
    .then(function(r) {
      clearTimeout(tid);
      if (r.status === 401) {
        sessionStorage.clear();
        window.location.href = 'login.html'+(LOJA_ID?'?loja='+encodeURIComponent(LOJA_ID):'');
        throw new Error('Sessão expirada');
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .catch(function(e) { clearTimeout(tid); throw e; });
}

// Mapa: nome de função GAS → [endpoint, método HTTP]
var _FN_MAP = {
  salvarItemFixo:         [L('/itens-fixos'),        'POST'],
  salvarCardapioCategoria:[L('/cardapio-categorias'),'POST'],
  salvarAcaiModelo:       [L('/acai-modelos'),       'POST'],
  salvarAcaiCategoria:    [L('/acai-categorias'),    'POST'],
  salvarAcaiIngrediente:  [L('/acai-ingredientes'),  'POST'],
  salvarBairro:           [L('/bairros'),            'POST'],
  salvarCupom:            [L('/cupons'),             'POST'],
  salvarTara:             [L('/taras'),              'POST'],
  salvarUsuario:          [L('/usuarios'),           'POST'],
  excluirItemFixo:        [L('/itens-fixos'),       'DELETE'],

function fmtMoeda(v){ return 'R$ '+parseFloat(v||0).toFixed(2).replace('.',','); }
function fmtData(str){ if(!str) return '--'; if(str.indexOf('T')>-1){ var d=new Date(str); if(isNaN(d)) return '--'; return (d.getDate()<10?'0':'')+d.getDate()+'/'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'/'+d.getFullYear(); } return str.split(' ')[0]; }
function fmtHora(str){ if(!str) return '--'; if(str.indexOf('T')>-1){ var d=new Date(str); if(isNaN(d)) return '--'; return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); } var p=str.split(' '); return p[1]?p[1].substring(0,5):'--'; }
function hojeStr(){
  var d=new Date();
  return ('0'+d.getDate()).slice(-2)+'/'+(('0'+(d.getMonth()+1)).slice(-2))+'/'+d.getFullYear();
}
function hojeISO(){
  var d=new Date();
  return d.getFullYear()+'-'+(('0'+(d.getMonth()+1)).slice(-2))+'-'+(('0'+d.getDate()).slice(-2));
}
function isoParaDDMM(iso){
  if(!iso)return '--';
  var p=iso.split('-');
  return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;
}
function ddmmParaISO(ddmm){
  if(!ddmm)return '';
  var p=ddmm.split('/');
  return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:'';
}

function carregarDados(){
  loading('Carregando dados...');
  api('GET', L('/dados-painel'))
    .then(function(dados){
      concluirCarregamento(dados);
    })
    .catch(function(err){
      // Se for bloqueio de permissão (403), pede apenas o que o cargo permite ver
      if(err.message && err.message.indexOf('403') > -1) {
         var fallback = {};
         var reqs = [
             // Busca as configurações e a logo na rota pública para não dar erro no Entregador
             api('GET', L('/cardapio')).then(function(d){ 
                 fallback.configuracoes = d.configuracoes || {}; 
                 fallback.itensFixos = Array.isArray(d) ? d : (d.prontos || []);
             }).catch(function(){}),
             api('GET', L('/delivery-ativo')).then(function(d){ fallback.deliveryAtivo = d; }).catch(function(){})
         ];
         // Se for Operador (bloqueado de dados financeiros, mas precisa do PDV)
         if (ST.usuario && ST.usuario.cargo !== 'Entregador') {
             reqs.push(api('GET', L('/pedidos/dia')).then(function(d){ fallback.pedidosDia = d; }).catch(function(){}));
             reqs.push(api('GET', L('/dados-monte-acai')).then(function(d){
                 fallback.acaiModelos = d.acaiModelos; fallback.acaiCategorias = d.acaiCategorias; fallback.acaiIngredientes = d.acaiIngredientes;
             }).catch(function(){}));
         }
         Promise.all(reqs).then(function(){
             concluirCarregamento(fallback);
         }).catch(function(e2){ mostrarErroCarregamento(e2); });
      } else {
         mostrarErroCarregamento(err);
      }
    });
}

// ── Som de novo pedido (Web Audio — sem arquivo externo) ────
// Cria a variável fora da função para reutilizar
var _audioCtx = null;

function tocarSomPedido() {
  try {
    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // Navegadores suspendem o áudio se não houver interação prévia
    if (_audioCtx.state === 'suspended') {
      _audioCtx.resume();
    }
    function bip(freq, ini, dur) {
      var o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
      o.connect(g); g.connect(_audioCtx.destination);
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.35, _audioCtx.currentTime + ini);
      g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + ini + dur);
      o.start(_audioCtx.currentTime + ini); 
      o.stop(_audioCtx.currentTime + ini + dur + 0.05);
    }
    bip(880, 0, 0.12); bip(1100, 0.15, 0.12); bip(880, 0.30, 0.22);
  } catch(e) {}
}

function dispararNotificacaoLocal(titulo, corpo) {
  tocarSomPedido();
  try {
    if (window.Notification && Notification.permission === 'granted') {
      var icone = (ST.dados && ST.dados.configuracoes && ST.dados.configuracoes.url_logo) ? ST.dados.configuracoes.url_logo : '';
      navigator.serviceWorker.getRegistration().then(function(reg) {
        if (reg) {
          // Vira uma notificação nativa do Android/iOS que acende a tela
          reg.showNotification(titulo, { body: corpo, icon: icone, vibrate: [300, 100, 300, 100, 300] });
        } else {
          new Notification(titulo, { body: corpo, icon: icone });
        }
      });
    }
  } catch(e) {}
}

function iniciarPolling(){
  if(ST.pollingTimer) clearInterval(ST.pollingTimer);
  ST.pollingTimer=setInterval(function(){
    
    // Se for Entregador, busca APENAS o Delivery Ativo para não tomar erro de permissão
    if(ST.usuario && ST.usuario.cargo === 'Entregador') {
       api('GET', L('/delivery-ativo')).then(function(res){
          if(!ST.dados) return;
          ST.dados.deliveryAtivo = res;
          var novos=(res||[]).filter(function(p){ 
              if ((p.status||'').toString().toUpperCase() !== 'NOVO') return false;
              // Se for Retirada, ignora e não toca o bip no celular do motoboy
              try {
                  var cli = typeof p.cliente_info === 'string' ? JSON.parse(p.cliente_info) : (p.cliente_info||{});
                  if (cli.endereco === 'Retirada na loja') return false;
              } catch(e) {}
              return true;
          }).length;
          
          if(ST._qtdDeliveryAnterior>=0 && novos>ST._qtdDeliveryAnterior) {
              tocarSomPedido(); // Apenas toca o bip (A notificação visual vem do Servidor)
          }
          ST._qtdDeliveryAnterior=novos;
          if(ST.abaAtiva==='abaDelivery') renderDelivery();
       }).catch(function(){});
       return;
    }

    // Para outros cargos (Dono, Gerente, Operador) continua normalmente
    api('GET', L('/polling'))
      .then(function(res){
        if(!ST.dados) return;
        
        var novosDel = (res.deliveryAtivo||[]).filter(function(p){ return (p.status||'').toString().toUpperCase()==='NOVO'; }).length;
        var novosBal = (res.pedidosDia?.pedidos||[]).filter(function(p){ return (p.status||'').toString().toUpperCase()==='NOVO' && p.origem === 'ONLINE'; }).length;
        var totalNovos = novosDel + novosBal;
        
        if(ST._qtdDeliveryAnterior >= 0 && totalNovos > ST._qtdDeliveryAnterior) {
            tocarSomPedido(); // Apenas toca o bip (A notificação visual vem do Servidor)
        }
        ST._qtdDeliveryAnterior = totalNovos;

        ST.dados.pedidosDia    = res.pedidosDia;
        ST.dados.deliveryAtivo = res.deliveryAtivo;
        if(ST.abaAtiva==='abaPedidos')  renderPedidosDia();
        if(ST.abaAtiva==='abaDelivery') renderDelivery();
        if(ST.abaAtiva==='abaRetirada') renderRetirada();
      })
      .catch(function(){});
  }, 15000);
}

      function shade(color, percent) {
          var f = parseInt(color.replace("#",""), 16),
              t = percent < 0 ? 0 : 255,
              p = percent < 0 ? percent * -1 : percent,
              R = f >> 16,
              G = f >> 8 & 0x00FF,
              B = f & 0x0000FF;
          return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
      }
      
      var corEscura = shade(corLoja, -0.15); // 15% mais escuro

function navegarPara(id){
  ST.abaAtiva=id;
  document.querySelectorAll('.aba-section').forEach(function(el){ el.classList.add('hidden'); });
  document.querySelectorAll('#sidebarNav a').forEach(function(a){
    a.classList.toggle('active', a.dataset.aba===id);
  });
  var sec=document.getElementById(id);
  if(sec) sec.classList.remove('hidden');

  // Ações ao entrar na aba
  if(id==='abaPedidos')    { renderPedidosDia(); }
  if(id==='abaDelivery')   { renderDelivery(); }
  if(id==='abaRetirada')   { renderRetirada(); }
  if(id==='abaRelatorios') { carregarRelatorio(); }
  if(id==='abaConfig')     { renderSecaoConfig(); }
}

function topBar(titulo, subtitulo, btnsHTML){
  return '<div class="top-bar"><div><h1>'+esc(titulo)+'</h1><p>'+esc(subtitulo)+'</p></div>'+
         '<div class="top-bar-actions">'+(btnsHTML||'')+'<button class="btn-refresh" onclick="refreshAbaAtual()" title="Atualizar dados do servidor"><i class="fa-solid fa-rotate-right"></i></button></div></div>';
}

function refreshAbaAtual(){
  if(ST.abaAtiva==='abaPedidos')          recarregarPedidosDia();
  else if(ST.abaAtiva==='abaDelivery')    recarregarDelivery();
  else if(ST.abaAtiva==='abaRetirada')    recarregarRetirada();
  else if(ST.abaAtiva==='abaRelatorios')  carregarRelatorio();
  else if(ST.abaAtiva==='abaMonteAcai')   recarregarMonteAcai();
  else if(ST.abaAtiva==='abaItens')       recarregarItens();
  else if(ST.abaAtiva==='abaConfig')      recarregarConfig();
  else navegarPara(ST.abaAtiva);
}

function recarregarConfig(){
  toast('Recarregando configurações...','');
  api('GET', L('/dados-config'))
    .then(function(dados){
      if(!ST.dados) ST.dados={};
      ST.dados.configuracoes = dados.configuracoes || {};
      ST.dados.usuarios      = dados.usuarios      || [];
      ST.dados.bairros       = dados.bairros        || [];
      ST.dados.cupons        = dados.cupons         || [];
      ST.dados.taras         = dados.taras          || [];
      renderSecaoConfig();
    })
    .catch(function(){
      toast('Erro ao recarregar configurações','error');
    });
}

// Recarrega Monte Açaí (modelos, categorias, ingredientes) do servidor
function recarregarMonteAcai(){
  api('GET', L('/dados-monte-acai'))
    .then(function(dados){
      if(!ST.dados) ST.dados={};
      ST.dados.acaiModelos      = dados.acaiModelos      || [];
      ST.dados.acaiCategorias   = dados.acaiCategorias   || [];
      ST.dados.acaiIngredientes = dados.acaiIngredientes || [];
      renderSecaoMonteAcai();
    })
    .catch(function(){ toast('Erro ao recarregar Monte Açaí','error'); });
}

// Recarrega Itens Fixos do servidor
function recarregarItens(){
  Promise.all([
    api('GET', L('/cardapio')),
    api('GET', L('/cardapio-categorias'))
  ]).then(function(res){
    var novos = res[0];
    var cats = res[1];
    if(!ST.dados) ST.dados={};
    ST.dados.itensFixos = Array.isArray(novos) ? novos : (novos.prontos || []);
    ST.dados.cardapioCategorias = cats || [];
    renderSecaoItens();
  }).catch(function(){ toast('Erro ao recarregar Itens','error'); });
}

function renderPedidosDia(){
  if(!ST.dados) return;
  var res=ST.dados.pedidosDia||{pedidos:[],resumo:{}};
  var pedidos=(res.pedidos||[]).slice().sort(function(a,b){
    // Converte dd/MM/yyyy HH:mm:ss → yyyy/MM/dd HH:mm:ss para sort correto
    function _sortKey(s){ var p=s?s.split(' '):[''];var d=p[0].split('/'); return (d[2]||'')+'/'+(d[1]||'')+'/'+(d[0]||'')+' '+(p[1]||''); }
    return _sortKey(b.data_hora||'').localeCompare(_sortKey(a.data_hora||''));
  });
  var resumo=res.resumo||{};

  // Contador
  var cont=document.getElementById('contadorPedidosDia');
  if(cont) cont.textContent=pedidos.length;

  // Resumo
  var rdiv=document.getElementById('resumoDia');
  if(rdiv){
    var emAberto=pedidos.filter(function(p){ return ['ENTREGUE','CANCELADO'].indexOf((p.status||'').toUpperCase())===-1; }).length;
    rdiv.innerHTML=
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        resCard('fa-money-bill-wave','Total','stat-green',fmtMoeda(resumo.totalVendas||0))+
        resCard('fa-receipt','Pedidos','stat-purple',(resumo.qtdPedidos||0)+' total')+
        resCard('fa-tag','Descontos','stat-orange',fmtMoeda(resumo.totalDescontos||0))+
        resCard('fa-clock','Em Aberto','stat-blue',emAberto+' pedido'+(emAberto!==1?'s':''))+
      '</div>'+
      '<div class="mt-3" style="font-size:12px;color:#6b7280">'+
        '<div class="flex justify-between mb-2"><span>Balcão</span><strong>'+(resumo.porOrigem&&resumo.porOrigem.BALCAO||0)+'</strong></div>'+
        '<div class="flex justify-between mb-2"><span>Delivery</span><strong>'+(resumo.porOrigem&&resumo.porOrigem.DELIVERY||0)+'</strong></div>'+
        '<div class="flex justify-between"><span>Online</span><strong>'+(resumo.porOrigem&&resumo.porOrigem.ONLINE||0)+'</strong></div>'+
      '</div>';
  }

  // Lista principal (balcão + delivery)
  var lista=document.getElementById('listaPedidosDia');
  if(lista){
    var pdvs=pedidos.filter(function(p){ var o=(p.origem||'').toUpperCase(); return o==='BALCAO'||o==='DELIVERY'; });
    lista.innerHTML=pdvs.length?pdvs.map(renderPedidoCard).join(''):'<div class="empty-state"><i class="fa-solid fa-utensils"></i><p>Nenhum pedido no balcão/delivery</p></div>';
  }

  // Lista online
  var onl=document.getElementById('listaOnline');
  if(onl){
    var online=pedidos.filter(function(p){ return (p.origem||'').toUpperCase()==='ONLINE'; });
    onl.innerHTML=online.length?online.map(renderPedidoCard).join(''):'<div class="empty-state"><i class="fa-solid fa-globe"></i><p>Nenhum pedido online</p></div>';
  }
}

function resCard(icon,label,cls,val){
  var accent={'stat-green':'#22c55e','stat-purple':'#7c3aed','stat-orange':'#f97316','stat-blue':'#3b82f6'}[cls]||'#94a3b8';
  return '<div style="background:#fff;border-radius:12px;padding:14px 16px;border:1px solid #e2e8f0;border-left:4px solid '+accent+';box-shadow:0 1px 6px rgba(0,0,0,.05)">'+
    '<div style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">'+
    '<i class="fa-solid '+icon+'" style="margin-right:4px;color:'+accent+'"></i>'+label+'</div>'+
    '<div style="font-size:17px;font-weight:900;color:#0f172a">'+val+'</div>'+
  '</div>';
}

function renderPedidoCard(p){
  var cli=parseCliente(p.cliente_info);
  var nomeCliente=cli.nome||'Cliente';
  var st=(p.status||'').toUpperCase();
  var origemDoCancelavel=['DELIVERY','ONLINE','BALCAO'].indexOf((p.origem||'').toUpperCase())>-1;
  var eBalcao=(p.origem||'').toUpperCase()==='BALCAO';
  // Balcão nasce ENTREGUE — permite cancelar mesmo assim; Delivery/Online não cancela se já entregue
  var podeCancelar=origemDoCancelavel&&st!=='CANCELADO'&&(eBalcao||st!=='ENTREGUE');
  var canceladoPor=p.cancelado_por?'<div class="text-xs text-red mt-2"><i class="fa-solid fa-circle-exclamation"></i> Cancelado por: '+esc(p.cancelado_por)+'</div>':'';

  return '<div class="pedido-card" data-status="'+((p.status||'').toUpperCase())+'">'+
    '<div class="pedido-card-header">'+
      '<div>'+
        '<div class="pedido-card-id">'+esc(p.id_venda)+'</div>'+
        '<div class="pedido-card-cliente">'+esc(nomeCliente)+'</div>'+
        '<div class="pedido-card-hora"><i class="fa-regular fa-clock"></i> '+esc(fmtHora(p.data_hora))+'</div>'+
      '</div>'+
      '<div style="text-align:right">'+badgeStatus(p.status)+'<br><div class="mt-2">'+badgeOrigem(p.origem)+'</div></div>'+
    '</div>'+
    '<div class="pedido-card-body">'+
      '<span class="pedido-card-total">'+fmtMoeda(p.total_final)+'</span>'+
      (p.metodo_pagamento?'<span class="badge" style="background:#f3f4f6;color:#374151"><i class="fa-solid fa-credit-card"></i>'+esc(p.metodo_pagamento)+'</span>':'')+
    '</div>'+
    canceladoPor+
    '<div class="pedido-card-footer">'+
      '<button class="btn btn-sm btn-secondary" onclick="verDetalhesPedido(\''+esc(p.id_venda)+'\')"><i class="fa-solid fa-eye"></i>Detalhes</button>'+
      '<button class="btn btn-sm btn-secondary" onclick="imprimirCupomBusca(\''+esc(p.id_venda)+'\')" title="Imprimir Cupom"><i class="fa-solid fa-print"></i></button>'+
      (podeCancelar?'<button class="btn btn-sm btn-danger" onclick="pedirCancelamento(\''+esc(p.id_venda)+'\')"><i class="fa-solid fa-ban"></i>Cancelar</button>':'')+
    '</div>'+
  '</div>';
}

function buscarPedidosUI(){
  var q=document.getElementById('inputBusca').value.trim();
  var div=document.getElementById('resultadoBusca');
  if(!q){ div.innerHTML=''; return; }
  if(q.length<3) return;
  // Debounce: aguarda 600ms sem digitar antes de buscar
  if(ST._buscaTimer) clearTimeout(ST._buscaTimer);
  div.innerHTML='<div class="flex items-center gap-2 text-muted text-sm"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div>Aguardando...</div>';
  ST._buscaTimer=setTimeout(function(){
    div.innerHTML='<div class="flex items-center gap-2 text-muted text-sm"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div>Buscando...</div>';
    api('GET', L('/pedidos/buscar?q=') + encodeURIComponent(q))
      .then(function(res){
        if(!res||res.length===0){ div.innerHTML='<p class="text-sm text-muted">Nenhum resultado encontrado.</p>'; return; }
        div.innerHTML='<p class="text-xs text-muted mb-2">'+res.length+' resultado(s)</p>'+res.map(renderPedidoCard).join('');
      })
      .catch(function(){ div.innerHTML='<p class="text-sm text-red">Erro na busca.</p>'; });
  }, 600);
}

// Cancelamento
function pedirCancelamento(idVenda){
  ST.cancelTarget=idVenda;
  document.getElementById('cancelPedidoId').textContent=idVenda;
  document.getElementById('authCancelLogin').value='';
  document.getElementById('authCancelSenha').value='';
  document.getElementById('authCancelMsg').innerHTML='';
  abrirModal('modalAuthCancel');
}

function confirmarCancelamento(){
  var login=document.getElementById('authCancelLogin').value.trim();
  var senha=document.getElementById('authCancelSenha').value;
  var msgEl=document.getElementById('authCancelMsg');
  var btn=document.getElementById('btnConfirmarCancel');
  if(!login||!senha){ msgEl.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-circle-exclamation"></i> Preencha login e senha.</p>'; return; }
  btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Verificando...';
  api('POST', L('/pedidos/') + ST.cancelTarget + '/cancelar', { login: login, senha: senha })
    .then(function(res){
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-ban"></i>Cancelar Pedido';
      if(res.sucesso){
        fecharModal('modalAuthCancel');
        toast(res.mensagem,'success');
        navegarPara('abaPedidos');
      } else {
        msgEl.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-circle-xmark"></i> '+esc(res.mensagem)+'</p>';
      }
    })
    .catch(function(e){
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-ban"></i>Cancelar Pedido';
      msgEl.innerHTML='<p class="text-sm text-red">Erro: '+esc(e)+'</p>';
    });
}

// Detalhes do pedido
function verDetalhesPedido(id){
  if(!ST.dados) return;
  var todos=(ST.dados.pedidosDia&&ST.dados.pedidosDia.pedidos)||[];
  var p=todos.find(function(x){ return x.id_venda===id; });
  // Se não encontrou em pedidosDia, procura em deliveryAtivo
  if(!p){
    var delivery=ST.dados.deliveryAtivo||[];
    p=delivery.find(function(x){ return x.id_venda===id; });
  }
  // Se ainda não encontrou, procura nos relatórios carregados na tela
  if(!p && window._relatorioAtual){
    p = window._relatorioAtual.find(function(x){ return x.id_venda===id; });
  }
  if(!p){ toast('Pedido não encontrado na listagem atual.','warn'); return; }
  var cli=parseCliente(p.cliente_info);
  var itens=parseItens(p.itens_comprados);

  var itensHTML=itens.map(function(it){
    return '<div class="flex justify-between items-center" style="padding:8px 0;border-bottom:1px solid #f3f4f6">'+
      '<div><div style="font-weight:600;font-size:13px">'+esc(it.descricao||it.nome||'Item')+'</div>'+
      (it.detalhes?'<div style="font-size:11px;color:#9ca3af">'+esc(it.detalhes)+'</div>':'')+
      '</div><div style="font-weight:800;color:#7c3aed">'+fmtMoeda(it.preco)+'</div></div>';
  }).join('');

  document.getElementById('modalFormTitle').innerHTML='<i class="fa-solid fa-receipt"></i> '+esc(p.id_venda);
  document.getElementById('modalFormBody').innerHTML=
    '<div class="flex gap-3 mb-4 flex-wrap">'+badgeStatus(p.status)+badgeOrigem(p.origem)+'</div>'+
    '<div class="grid-2 mb-4">'+
      infoBox('Cliente',cli.nome||'--')+
      infoBox('Telefone',cli.telefone||'--')+
      infoBox('Data',fmtData(p.data_hora))+
      infoBox('Hora',fmtHora(p.data_hora))+
      infoBox('Pagamento',p.metodo_pagamento||'--')+
      infoBox('Operador',p.operador||'--')+
    '</div>'+
    (cli.endereco?'<div class="form-group"><label class="form-label">Endereço</label><div style="padding:10px;background:#f9fafb;border-radius:8px;font-size:13px">'+esc(cli.endereco)+'</div></div>':'')+
    '<div class="form-group"><label class="form-label">Itens</label>'+itensHTML+'</div>'+
    '<div class="caixa-total mt-2">'+
      '<div class="caixa-total-row"><span>Subtotal</span><span>'+fmtMoeda(p.subtotal)+'</span></div>'+
      (parseFloat(p.desconto)>0?'<div class="caixa-total-row"><span>Desconto</span><span style="color:#16a34a">-'+fmtMoeda(p.desconto)+'</span></div>':'')+
      (parseFloat(p.taxa_entrega)>0?'<div class="caixa-total-row"><span>Taxa de Entrega</span><span>'+fmtMoeda(p.taxa_entrega)+'</span></div>':'')+
      '<div class="caixa-total-row big"><span>Total</span><span>'+fmtMoeda(p.total_final)+'</span></div>'+
      (parseFloat(p.troco)>0?'<div class="caixa-total-row" style="color:#16a34a"><span>Troco</span><span>'+fmtMoeda(p.troco)+'</span></div>':'')+
    '</div>'+
    (p.cancelado_por?'<div class="auth-panel mt-4"><i class="fa-solid fa-ban text-red"></i> <strong>Cancelado por:</strong> '+esc(p.cancelado_por)+'</div>':'');

  document.getElementById('modalFormFooter').innerHTML='<button class="btn btn-secondary" onclick="fecharModal(\'modalFormCrud\')">Fechar</button>';
  abrirModal('modalFormCrud');
}

function infoBox(label,val){
  return '<div style="background:#f8fafc;border-radius:10px;padding:11px 14px;border:1px solid #e2e8f0;">'+
    '<div style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">'+esc(label)+'</div>'+
    '<div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:4px">'+esc(val)+'</div></div>';
}

// Helper para atualizar o estado vazio/preenchido do carrinho balcão
function _atualizarCarrinhoBalcao(){
  var totalItens = ST.pdvAcaiItens.length + ST.pdvBalcaoItens.length;
  var vazio = document.getElementById('b_carrinhoVazio');
  var counter = document.getElementById('b_qtdItens');
  if(vazio) vazio.style.display = totalItens > 0 ? 'none' : 'flex';
  if(counter) counter.textContent = totalItens + ' item(ns)';
}

var _pgtoColors={

  PIX:     {bg:'#eff6ff',border:'#93c5fd',color:'#1d4ed8',active:'#2563eb'},
  CARTAO:  {bg:'#f5f3ff',border:'#c4b5fd',color:'#6d28d9',active:'#7c3aed'}
};
function pgBtn(grupo,val,icon,label){
  var sc=_pgtoShortcuts[val]?'<kbd style="font-size:8px;opacity:.5;background:rgba(0,0,0,.07);border-radius:3px;padding:1px 4px;position:absolute;top:5px;right:5px">'+_pgtoShortcuts[val]+'</kbd>':'';
  var c=_pgtoColors[val]||{bg:'#fff',border:'#e5e7eb',color:'#374151'};
  return '<button type="button" onclick="selecionarPgto(\''+grupo+'\',\''+val+'\')" id="pg_'+grupo+'_'+val+'" '+
    'class="pgto-btn" '+

function selecionarPgto(grupo,val){
  // Salva no estado (resolve bug de múltiplos cliques)
  ST.pgtoAtivo[grupo]=val;

  // Reseta visual de todos os botões do grupo para estado neutro
  document.querySelectorAll('[id^="pg_'+grupo+'_"]').forEach(function(el){
    var _val=el.id.replace('pg_'+grupo+'_','');
    var c=_pgtoColors[_val]||{bg:'#fff',border:'#e5e7eb',color:'#374151'};
    el.style.background=c.bg;
    el.style.borderColor=c.border;
    el.style.color=c.color;
    el.style.boxShadow='none';
    el.style.transform='none';
  });

  // Ativa o botão selecionado
  var btn=document.getElementById('pg_'+grupo+'_'+val);
  if(btn){
    var ac=(_pgtoColors[val]||{}).active||'#7c3aed';
    btn.style.background=ac;
    btn.style.borderColor=ac;
    btn.style.color='#fff';
    btn.style.boxShadow='0 3px 12px '+ac+'50';
    btn.style.transform='translateY(-1px)';
  }

  // Mostra/esconde campo de troco apenas para o modal correto
  if(grupo==='b_pgto'){
    var tgB=document.getElementById('b_trocoGroup');
    if(tgB) tgB.style.display=(val==='DINHEIRO')?'block':'none';
    if(document.getElementById('b_pesoBruto')) calcBalcao();
  } else if(grupo==='d_pgto'){
    var tgD=document.getElementById('d_trocoGroup');
    if(tgD) tgD.style.display=(val==='DINHEIRO')?'block':'none';
    if(document.getElementById('d_taxa')) calcDelivery();
  }
}

function selecionarTara(){
  var sel=document.getElementById('b_tara');
  var opt=sel.options[sel.selectedIndex];
  var peso=opt.dataset.peso||0;
  document.getElementById('b_pesoTara').value=peso;
  calcBalcao();
}

function calcBalcao(){
  var bruto=parseFloat(document.getElementById('b_pesoBruto').value||0);
  var tara =parseFloat(document.getElementById('b_pesoTara').value||0);
  var kgP  =parseFloat(document.getElementById('b_precoKG').value||0);
  var liq  =Math.max(0,bruto-tara);
  var vAcai=Math.round((liq/1000)*kgP*100)/100;
  var somaAcaiCartTmp=ST.pdvAcaiItens.reduce(function(s,i){ return s+i.preco; },0);
  var extrasTmp=ST.pdvBalcaoItens.reduce(function(s,i){ return s+i.preco; },0);
  var subtotalTmp=vAcai+somaAcaiCartTmp+extrasTmp;
  // Cupom PERCENTUAL: recalcula desconto em R$ sobre subtotal atual
  if(ST._cupomAtivo&&ST._cupomAtivo.tipo==='PERCENTUAL'&&ST._cupomAtivo.hiddenId==='b_desconto'){
    var descPct=Math.round(subtotalTmp*(ST._cupomAtivo.valor/100)*100)/100;
    document.getElementById('b_desconto').value=descPct;
  }
  var desc =parseFloat(document.getElementById('b_desconto').value||0);
  // Soma açaís já adicionados ao carrinho
  var somaAcaiCart=ST.pdvAcaiItens.reduce(function(s,i){ return s+i.preco; },0);
  var extras=ST.pdvBalcaoItens.reduce(function(s,i){ return s+i.preco; },0);
  var subtotal=vAcai+somaAcaiCart+extras;
  var total=Math.max(0,subtotal-desc);
  var valorPago=parseFloat((document.getElementById('b_valorPago')||{}).value||0);
  var troco=Math.max(0,valorPago-total);

  document.getElementById('b_pesoLiqVal').textContent=liq+'g';
  document.getElementById('b_valorAcaiVal').textContent=fmtMoeda(vAcai);
  document.getElementById('b_r_acai').textContent=fmtMoeda(vAcai);
  // Açaís no carrinho
  var acaiExtraEl=document.getElementById('b_r_acai_extra');
  if(acaiExtraEl) acaiExtraEl.textContent=fmtMoeda(somaAcaiCart);
  document.getElementById('b_r_extras').textContent=fmtMoeda(extras);
  document.getElementById('b_r_desc').textContent='-'+fmtMoeda(desc);
  document.getElementById('b_r_total').textContent=fmtMoeda(total);

  var tBox=document.getElementById('b_trocoDisplay');
  if(tBox){
    if(valorPago>0&&troco>=0){tBox.classList.remove('hidden');document.getElementById('b_trocoVal').textContent=fmtMoeda(troco);}
    else tBox.classList.add('hidden');
  }
}

function adicionarItemBalcao(){
  var sel=document.getElementById('b_itemSelect');
  var opt=sel.options[sel.selectedIndex];
  if(!opt.value) return;
  var qtd=Math.max(1,parseInt((document.getElementById('b_itemQtd')||{}).value||1));
  var precoUnit=parseFloat(opt.dataset.preco)||0;
  var item={
    id:opt.value,
    descricao:opt.dataset.nome,
    quantidade:qtd,
    precoUnit:precoUnit,
    preco:Math.round(precoUnit*qtd*100)/100
  };
  ST.pdvBalcaoItens.push(item);
  sel.selectedIndex=0;
  var qtdEl=document.getElementById('b_itemQtd');
  if(qtdEl) qtdEl.value=1;
  renderListaBalcao();
  calcBalcao();
}

function removerItemBalcao(idx){

  renderListaBalcao(); calcBalcao();

function renderListaBalcao(){
  var ul=document.getElementById('b_listaItens');
  if(!ul) return;
  ul.innerHTML=ST.pdvBalcaoItens.map(function(item,i){
    var qtd=item.quantidade||1;
    var sub='<div style="font-size:10px;color:#94a3b8;margin-top:1px">'+fmtMoeda(item.precoUnit||item.preco)+' × '+qtd+'</div>';
    return '<li>'+
      '<div style="flex:1;min-width:0">'+
        '<span class="caixa-item-nome">'+esc(item.descricao)+'</span>'+
        (qtd>1?sub:'')+

      (qtd>1?'<span class="caixa-item-qty">×'+qtd+'</span>':'')+
      '<span class="caixa-item-preco">'+fmtMoeda(item.preco)+'</span>'+
      '<button class="caixa-item-rem" onclick="removerItemBalcao('+i+')"><i class="fa-solid fa-xmark"></i></button></li>';
  }).join('');
  _atualizarCarrinhoBalcao();
}

// ─── Multi-açaí: adicionar pesagem ao carrinho ───────────────
function adicionarAcaiBalcao(){
  var bruto=parseFloat(document.getElementById('b_pesoBruto').value||0);
  var tara =parseFloat(document.getElementById('b_pesoTara').value||0);
  var kgP  =parseFloat(document.getElementById('b_precoKG').value||0);

  if(bruto<=0){
    toast('Informe o peso bruto antes de adicionar.','warn');
    return;
  }

  var liq  =Math.max(0,bruto-tara);
  var preco=Math.round((liq/1000)*kgP*100)/100;

  ST.pdvAcaiItens.push({
    tipo:'acai_balanca',
    descricao:'Produto — '+liq+'g',
    detalhes:bruto+'g bruto − '+tara+'g tara',
    preco:preco,
    pesoBruto:bruto, pesoTara:tara, pesoLiq:liq
  });

  // Limpa os campos de peso para a próxima pesagem
  document.getElementById('b_pesoBruto').value='';
  document.getElementById('b_pesoTara').value='0';
  document.getElementById('b_tara').selectedIndex=0;
  document.getElementById('b_pesoLiqVal').textContent='0 g';
  document.getElementById('b_valorAcaiVal').textContent='R$ 0,00';

  renderListaAcaiBalcao();
  calcBalcao();
  toast(liq+'g adicionado ao carrinho!','success');
}

function finalizarBalcao(){
  // Guard anti-duplo-clique
  if(ST.registrando) return;

  var bruto=parseFloat(document.getElementById('b_pesoBruto').value||0);
  var tara =parseFloat(document.getElementById('b_pesoTara').value||0);
  var kgP  =parseFloat(document.getElementById('b_precoKG').value||0);
  var pgto =getPgtoSelecionado('b_pgto');
  var msg  =document.getElementById('b_finMsg');

  // Aceita: peso atual > 0 OU itens de açaí no carrinho
  var temAcaiCarrinho=ST.pdvAcaiItens.length>0;
  if(bruto<=0&&!temAcaiCarrinho&&!ST.pdvBalcaoItens.length){
    msg.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-exclamation-circle"></i> Adicione ao menos um produto ao carrinho.</p>'; return;
  }
  if(!pgto){ msg.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-exclamation-circle"></i> Selecione a forma de pagamento.</p>'; return; }

  var taraEl=document.getElementById('b_tara');
  var idTara=taraEl.value||'';
  var btn=document.getElementById('b_btnFinalizar');
  ST.registrando=true;
  btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Registrando...';

  // Combina açaís do carrinho + itens extras para enviar ao backend
  var todosItensExtras=
    ST.pdvAcaiItens.map(function(i){ return {tipo:i.tipo,descricao:i.descricao,detalhes:i.detalhes,preco:i.preco}; })
    .concat(ST.pdvBalcaoItens.map(function(i){ return {descricao:i.descricao,preco:i.preco}; }));

  var dados={
    operador:   ST.usuario.nome,
    pesoBruto_g:bruto, idTara:idTara, pesoTara_g:tara, precoKG:kgP,
    itensExtras:todosItensExtras,
    desconto:   parseFloat(document.getElementById('b_desconto').value||0),
    pagamento:  pgto,
    valorPago:  parseFloat((document.getElementById('b_valorPago')||{}).value||0),
    nomeCliente:document.getElementById('b_nomeCliente').value.trim(),
    telefone:   document.getElementById('b_telefone').value.trim(),
    observacao: (document.getElementById('b_observacao')||{value:''}).value.trim()
  };

  api('POST', L('/pedidos/balcao'), dados)
    .then(function(res){
      ST.registrando=false;
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check-circle"></i>Finalizar Venda';
      if(res.sucesso){
        fecharModal('modalBalcao');
        toast('Venda registrada! Total: '+fmtMoeda(res.total),'success');
        if(res.troco>0) toast('Troco: '+fmtMoeda(res.troco),'');
        // Atualização otimista: insere localmente sem segunda chamada ao servidor
        var agora=new Date();
        var dd=agora.getDate()<10?'0'+agora.getDate():agora.getDate();
        var mm=agora.getMonth()<9?'0'+(agora.getMonth()+1):(agora.getMonth()+1);
        var hh=agora.getHours()<10?'0'+agora.getHours():agora.getHours();

        var novoItem={

        ST.dados.pedidosDia.pedidos.unshift(novoItem);

function selecionarBairro(){
  var sel=document.getElementById('d_bairro');
  var opt=sel.options[sel.selectedIndex];
  var taxa=opt.dataset.taxa||0;
  document.getElementById('d_taxa').value=taxa;
  calcDelivery();
}

function adicionarItemDelivery(){
  var sel=document.getElementById('d_itemSelect');
  var opt=sel.options[sel.selectedIndex];
  if(!opt.value) return;
  var qtd=Math.max(1,parseInt((document.getElementById('d_itemQtd')||{}).value||1));
  var precoUnit=parseFloat(opt.dataset.preco)||0;
  ST.pdvDeliveryItens.push({
    id:opt.value,
    descricao:opt.dataset.nome,
    quantidade:qtd,
    precoUnit:precoUnit,
    preco:Math.round(precoUnit*qtd*100)/100
  });
  sel.selectedIndex=0;
  var qtdEl=document.getElementById('d_itemQtd');
  if(qtdEl) qtdEl.value=1;
  renderListaDeliveryPDV(); calcDelivery();
}

function removerItemDelivery(idx){
  ST.pdvDeliveryItens.splice(idx,1);
  renderListaDeliveryPDV(); calcDelivery();
}

function renderListaDeliveryPDV(){
  var ul=document.getElementById('d_listaItens');
  if(!ul) return;
  var counter=document.getElementById('d_qtdItens');
  if(counter) counter.textContent=ST.pdvDeliveryItens.length+' item(ns)';
  if(!ST.pdvDeliveryItens.length){
    ul.innerHTML='<li style="justify-content:center;color:#94a3b8;font-size:12.5px;padding:24px 0;flex-direction:column;gap:8px"><i class="fa-solid fa-basket-shopping" style="font-size:28px;opacity:.3;display:block;text-align:center"></i>Nenhum produto adicionado</li>';
    return;
  }
  ul.innerHTML=ST.pdvDeliveryItens.map(function(item,i){
    var qtd=item.quantidade||1;
    var sub='<div style="font-size:10px;color:#94a3b8;margin-top:1px">'+fmtMoeda(item.precoUnit||item.preco)+' × '+qtd+'</div>';
    return '<li>'+
      '<div style="flex:1;min-width:0">'+
        '<span class="caixa-item-nome">'+esc(item.descricao)+'</span>'+
        (qtd>1?sub:'')+
      '</div>'+
      (qtd>1?'<span class="caixa-item-qty">×'+qtd+'</span>':'')+
      '<span class="caixa-item-preco">'+fmtMoeda(item.preco)+'</span>'+
      '<button class="caixa-item-rem" onclick="removerItemDelivery('+i+')"><i class="fa-solid fa-xmark"></i></button></li>';
  }).join('');
}

function calcDelivery(){
  var sub=ST.pdvDeliveryItens.reduce(function(s,i){ return s+i.preco; },0);
  // Cupom PERCENTUAL: recalcula desconto em R$ sobre subtotal atual
  if(ST._cupomAtivo&&ST._cupomAtivo.tipo==='PERCENTUAL'&&ST._cupomAtivo.hiddenId==='d_desconto'){
    var descPctD=Math.round(sub*(ST._cupomAtivo.valor/100)*100)/100;
    document.getElementById('d_desconto').value=descPctD;
  }
  var desc=parseFloat((document.getElementById('d_desconto')||{}).value||0);
  var taxa=parseFloat((document.getElementById('d_taxa')||{}).value||0);
  var total=Math.max(0,sub-desc+taxa);
  var valorPago=parseFloat((document.getElementById('d_valorPago')||{}).value||0);
  var troco=Math.max(0,valorPago-total);
  var el=function(id){ return document.getElementById(id); };
  if(el('d_r_sub')) el('d_r_sub').textContent=fmtMoeda(sub);
  if(el('d_r_desc')) el('d_r_desc').textContent='-'+fmtMoeda(desc);
  if(el('d_r_taxa')) el('d_r_taxa').textContent=fmtMoeda(taxa);
  if(el('d_r_total')) el('d_r_total').textContent=fmtMoeda(total);
  var tBox=el('d_trocoDisplay');
  if(tBox){ if(valorPago>0){ tBox.classList.remove('hidden'); el('d_trocoVal').textContent=fmtMoeda(troco); } else tBox.classList.add('hidden'); }
}

function finalizarDeliveryPDV(){

  if(!end) { msg.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-exclamation-circle"></i> Informe o endereço.</p>'; return; }

        var hh=agora.getHours()<10?'0'+agora.getHours():agora.getHours();
        var min=agora.getMinutes()<10?'0'+agora.getMinutes():agora.getMinutes();
        var ss=agora.getSeconds()<10?'0'+agora.getSeconds():agora.getSeconds();
        var dataHoraLocal=dd+'/'+mm+'/'+agora.getFullYear()+' '+hh+':'+min+':'+ss;
        var novoItemDel={

          itens_comprados:dados.itens||[],
          total_final:res.total||0,
          metodo_pagamento:dados.pagamento||'',

          taxa_entrega:dados.taxaEntrega||0,
          subtotal:res.total-(dados.taxaEntrega||0), cancelado_por:''
        };
        if(!ST.dados) ST.dados={};
        if(!ST.dados.pedidosDia) ST.dados.pedidosDia={pedidos:[],resumo:{}};
        if(!ST.dados.pedidosDia.pedidos) ST.dados.pedidosDia.pedidos=[];
        ST.dados.pedidosDia.pedidos.unshift(novoItemDel);
        if(ST.abaAtiva!=='abaPedidos') navegarPara('abaPedidos');
        else renderPedidosDia();
      } else {
        msg.innerHTML='<p class="text-sm text-red"><i class="fa-solid fa-circle-xmark"></i> '+esc(res.mensagem)+'</p>';
      }
    })
    .catch(function(e){
      ST.registrando=false;
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-motorcycle"></i>Registrar Pedido Delivery';
      msg.innerHTML='<p class="text-sm text-red">Erro: '+esc(e)+'</p>';
    });
}

// Cupom genérico
// ST._cupomAtivo guarda tipo e valor para recálculo dinâmico de %
function aplicarCupom(inputId,hiddenId,msgId,callback){
  var codigo=document.getElementById(inputId).value.trim();
  var msgEl=document.getElementById(msgId);
  if(!codigo){ msgEl.innerHTML='<span class="text-red">Digite um código.</span>'; return; }
  msgEl.innerHTML='<span class="text-muted">Verificando...</span>';
  api('GET', L('/cupons/validar?codigo=') + encodeURIComponent(codigo))
    .then(function(res){
      if(res.valido){
        // Armazena cupom ativo para uso no calcBalcao/calcDelivery
        ST._cupomAtivo={ hiddenId:hiddenId, tipo:res.tipo, valor:res.valor };
        // Se VALOR fixo: já seta o hidden; se PERCENTUAL: será calculado no calc*
        if(res.tipo!=='PERCENTUAL') document.getElementById(hiddenId).value=res.valor;
        msgEl.innerHTML='<span class="text-green"><i class="fa-solid fa-check"></i> '+esc(res.mensagem)+'</span>';
        if(callback) callback();
      } else {
        ST._cupomAtivo=null;
        document.getElementById(hiddenId).value=0;
        msgEl.innerHTML='<span class="text-red"><i class="fa-solid fa-xmark"></i> '+esc(res.mensagem)+'</span>';
        if(callback) callback();
      }
    })
    .catch(function(){ msgEl.innerHTML='<span class="text-red">Erro ao validar cupom.</span>'; });
}

// INTEGRAÇÃO COM BALANÇA (EM SEGUNDO PLANO)
// ═══════════════════════════════════════════════════════════
let balancaPort = null;
let balancaReader = null;
let manterLeitura = false;

async function conectarBalanca() {
  if (!('serial' in navigator)) {
    toast('Seu navegador não suporta balança.', 'error'); return;
  }
  
  try {
    // Se já estiver rodando, não faz nada
    if (balancaPort && manterLeitura) {
      toast('A balança já está operando em segundo plano!', 'success');
      return;
    }

    // Procura portas que o usuário já autorizou antes (Reconexão Mágica)
    const ports = await navigator.serial.getPorts();
    if (ports.length > 0) {
      balancaPort = ports[0]; 
    } else {
      // Se for a primeira vez na vida, pede permissão ao usuário
      balancaPort = await navigator.serial.requestPort();
    }

    await balancaPort.open({ baudRate: 9600 }); 
    manterLeitura = true;
    atualizarBotaoBalanca(true);
    toast('Balança conectada! Deixando em segundo plano.', 'success');
    
    // Inicia o loop infinito de leitura
    lerDadosBalanca();
  } catch (e) {
    toast('Erro ao conectar balança.', 'error');
    console.error(e);
  }
}

function atualizarBotaoBalanca(conectado) {
  let btn = document.getElementById('btnBalanca');
  if (!btn) return;
  if (conectado) {
     btn.innerHTML = '<i class="fa-solid fa-link-slash"></i> Ligada em Segundo Plano';
     btn.style.color = '#16a34a'; 
     btn.style.borderColor = '#bbf7d0';
     btn.style.background = '#f0fdf4';
  } else {
     btn.innerHTML = '<i class="fa-solid fa-link"></i> Ligar Balança';
     btn.style.color = '#6b7280'; 
     btn.style.borderColor = '#d1d5db';
     btn.style.background = '#f3f4f6';
  }
}

async function lerDadosBalanca() {
  while (balancaPort && balancaPort.readable && manterLeitura) {
    const textDecoder = new TextDecoderStream();
    const readableStreamClosed = balancaPort.readable.pipeTo(textDecoder.writable);
    balancaReader = textDecoder.readable.getReader();
    let buffer = '';

    try {
      while (true) {
        const { value, done } = await balancaReader.read();
        if (done) break;
        if (value) {
          buffer += value;
          
          let stxIdx = buffer.lastIndexOf(String.fromCharCode(2));
          let etxIdx = buffer.indexOf(String.fromCharCode(3), stxIdx);
          
          if (stxIdx !== -1 && etxIdx !== -1 && etxIdx > stxIdx) {
            let pesoStr = buffer.substring(stxIdx + 1, etxIdx).replace(/[^0-9]/g, '');
            
            if (pesoStr.length >= 4) {
              let pesoGramas = parseInt(pesoStr, 10);
              let inpPeso = document.getElementById('b_pesoBruto');
              
              // O Segredo: Ele só escreve na tela se o modal do balcão estiver aberto!
              if (inpPeso && parseInt(inpPeso.value || 0) !== pesoGramas) {
                  inpPeso.value = pesoGramas;
                  calcBalcao();
              }
            }
            buffer = buffer.substring(etxIdx + 1); 
          }
          if (buffer.length > 50) buffer = buffer.substring(buffer.length - 20);
        }
      }
    } catch (error) {
      console.error("Cabo da balança foi desconectado:", error);
      manterLeitura = false;
      balancaPort = null;
      atualizarBotaoBalanca(false);
    } finally {
      balancaReader.releaseLock();
    }
  }
}

function limparFiltrosRelatorio(){
  document.getElementById('rel_dtIni').value=hojeISO();

  document.getElementById('rel_origem').value='';
  document.getElementById('rel_status').value='';
  document.getElementById('rel_operador').value='';
  carregarRelatorio();
}

function carregarRelatorio(){
  var dtIniISO=document.getElementById('rel_dtIni').value||hojeISO();
  var dtFimISO=document.getElementById('rel_dtFim').value||hojeISO();
  var params={
    dataInicio: isoParaDDMM(dtIniISO),
    dataFim:    isoParaDDMM(dtFimISO),
    pagamento:  document.getElementById('rel_pgto').value||'',
    origem:     document.getElementById('rel_origem').value||'',
    status:     document.getElementById('rel_status').value||'',
    operador:   document.getElementById('rel_operador').value||''
  };

  var tbody=document.getElementById('relTbody');
  if(tbody) tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px"><div class="spinner" style="margin:auto"></div></td></tr>';

  var _qRel = Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]||''); }).join('&');
  api('GET', L('/pedidos/relatorio?') + _qRel)
    .then(renderRelatorio)
    .catch(function(e){
      if(tbody) tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:#ef4444">Erro: '+esc(e)+'</td></tr>';
    });
}

function renderRelatorio(data){
  var pedidos=data.pedidos||[];
  var resumo=data.resumo||{};
  window._relatorioAtual = pedidos; // Salva para uso na impressora

  // Garante que o Entregador também seja filtrado se for digitado na barra de pesquisa
  var opSearch = (document.getElementById('rel_operador').value || '').trim().toLowerCase();
  if (opSearch) {
      pedidos = pedidos.filter(function(p) {
          var op = (p.operador || '').toLowerCase();
          var en = (p.entregador_nome || '').toLowerCase();
          return op.indexOf(opSearch) > -1 || en.indexOf(opSearch) > -1;
      });
  }

  // Cards de resumo
  var sc=document.getElementById('relSummaryCards');
  if(sc){
    sc.innerHTML=
      statCardRel('fa-money-bill-wave','Total de Vendas','stat-green',fmtMoeda(resumo.totalVendas||0),'')+
      statCardRel('fa-receipt','Pedidos','stat-purple',(resumo.qtdPedidos||0),'no período')+
      statCardRel('fa-tag','Descontos','stat-orange',fmtMoeda(resumo.totalDescontos||0),'')+
      statCardRel('fa-chart-line','Ticket Médio','stat-blue',fmtMoeda(resumo.ticketMedio||0),'por pedido');
  }

  // Breakdown
  var bd=document.getElementById('relBreakdown');
  if(bd){
    bd.innerHTML=
      breakCard('Por Origem',resumo.porOrigem||{},'fa-globe')+
      breakCard('Por Pagamento',resumo.porPagamento||{},'fa-credit-card');
  }

  // Tabela
  var count=document.getElementById('relPedidosCount');
  if(count) count.textContent=pedidos.length;

  var tbody=document.getElementById('relTbody');
  if(!tbody) return;
  if(!pedidos.length){
    tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#9ca3af">Nenhum pedido no período/filtro selecionado</td></tr>';
    return;
  }
  tbody.innerHTML=pedidos.map(function(p){
    var cli=parseCliente(p.cliente_info);
    var opText = esc(p.operador||'--');
  if(p.origem === 'DELIVERY' && p.entregador_nome) opText += '<br><span style="font-size:10px;color:#f97316"><i class="fa-solid fa-motorcycle"></i> ' + esc(p.entregador_nome) + '</span>';

  return '<tr>'+
    '<td><span style="font-size:11px;font-weight:700;color:#7c3aed">'+esc(p.id_venda)+'</span></td>'+
    '<td><div style="font-size:12px">'+esc(fmtData(p.data_hora))+'</div><div style="font-size:11px;color:#9ca3af">'+esc(fmtHora(p.data_hora))+'</div></td>'+
    '<td>'+esc(cli.nome||'--')+'</td>'+
    '<td>'+badgeOrigem(p.origem)+'</td>'+
    '<td><span style="font-size:12px">'+esc(p.metodo_pagamento||'--')+'</span></td>'+
    '<td><span style="font-size:12px">'+opText+'</span></td>'+
    '<td><strong style="color:#7c3aed">'+fmtMoeda(p.total_final)+'</strong></td>'+
    '<td>'+badgeStatus(p.status)+'</td>'+
    '<td><div class="flex gap-2">'+
      '<button class="btn btn-xs btn-secondary" onclick="verDetalhesPedido(\''+esc(p.id_venda)+'\')" title="Ver Detalhes"><i class="fa-solid fa-eye"></i></button>'+
      '<button class="btn btn-xs btn-secondary" onclick="imprimirCupomBusca(\''+esc(p.id_venda)+'\')" title="Imprimir Cupom"><i class="fa-solid fa-print"></i></button>'+
      (ST.usuario.cargo === 'Dono' ? '<button class="btn btn-xs btn-danger" onclick="confirmarExcluir(\'Venda\',\''+esc(p.id_venda)+'\',\''+esc(p.id_venda)+'\',\'excluirPedido\')" title="Excluir Definitivamente"><i class="fa-solid fa-trash"></i></button>' : '')+
    '</div></td>'+
  '</tr>';
  }).join('');
}

function statCardRel(icon,label,cls,val,sub){
  return '<div class="stat-card '+cls+'">'+
    '<div class="stat-icon"><i class="fa-solid '+icon+'"></i></div>'+
    '<div class="stat-label">'+label+'</div>'+
    '<div class="stat-value">'+val+'</div>'+
    (sub?'<div class="stat-sub">'+sub+'</div>':'')+
  '</div>';
}

function breakCard(titulo,obj,icon){
  var rows=Object.keys(obj).map(function(k,i){
    return '<div class="flex justify-between" style="padding:8px 10px;border-radius:7px;font-size:13px;background:'+(i%2===0?'#f8fafc':'#fff')+';">'+
      '<span style="color:#475569;font-weight:600">'+esc(k||'--')+'</span>'+
      '<strong style="color:#0f172a">'+obj[k]+'</strong></div>';
  }).join('');
  return '<div class="card"><div class="card-header"><div class="card-title"><div class="icon"><i class="fa-solid '+icon+'"></i></div>'+titulo+'</div></div>'+
    '<div class="card-body">'+(rows||'<p class="text-muted text-sm">Sem dados</p>')+'</div></div>';
}

var _dragSrcCardapioCat = null;
function dragStartCardapioCat(e) { _dragSrcCardapioCat = e.currentTarget; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', _dragSrcCardapioCat.innerHTML); e.currentTarget.style.opacity = '0.5'; }
function dragOverCardapioCat(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
function dragEndCardapioCat(e) { e.currentTarget.style.opacity = '1'; }
function dropCardapioCat(e) {
  e.stopPropagation(); e.preventDefault();
  var tr = e.target.closest('tr');
  if (_dragSrcCardapioCat && tr && _dragSrcCardapioCat !== tr) {
    var tbody = tr.parentNode;
    var items = Array.from(tbody.querySelectorAll('tr'));
    var fromIdx = items.indexOf(_dragSrcCardapioCat);
    var toIdx = items.indexOf(tr);
    if(fromIdx < toIdx) tbody.insertBefore(_dragSrcCardapioCat, tr.nextSibling);
    else tbody.insertBefore(_dragSrcCardapioCat, tr);
    salvarOrdemCardapioCategorias();
  }
  return false;
}
function salvarOrdemCardapioCategorias() {
  var rows = document.querySelectorAll('#tbodyCardapioCats tr[data-id]');
  var promessas = [];
  var ordemAtual = 1;
  rows.forEach(function(row) {
    var id = row.getAttribute('data-id');
    var cat = ST.dados.cardapioCategorias.find(function(x) { return x.id_categoria === id; });
    if(cat && parseInt(cat.ordem) !== ordemAtual) {
      cat.ordem = ordemAtual;
      promessas.push(api('POST', L('/cardapio-categorias'), cat));
    }
    ordemAtual++;
  });
  if(promessas.length > 0) {
     toast('Salvando nova ordem...', 'warn');
     Promise.all(promessas).then(function() { toast('Ordem atualizada!', 'success'); recarregarItens(); })
     .catch(function() { toast('Erro ao atualizar ordem.', 'error'); });

function fGroup(label,id,type,val,ph){
  return '<div class="form-group"><label class="form-label">'+label+'</label><input type="'+type+'" class="form-control" id="'+id+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"/></div>';

function fGroupSel(label,id,opts,val){
  return '<div class="form-group"><label class="form-label">'+label+'</label><select class="form-control" id="'+id+'">'+
    opts.map(function(o){ 
      var display = o;
      if (o === 'true') display = 'Sim';
      if (o === 'false') display = 'Não';
      return '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(display)+'</option>'; 
    }).join('')+'</select></div>';
}

function chamarSalvar(fn,dados,tbodyId,renderFn,modalId,cacheKey){
  var btn=document.querySelector('#'+modalId+' .btn-primary');
  if(btn){ btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></div>Salvando...'; }
  var mapeamento = _FN_MAP[fn];
  if(!mapeamento){ toast('Função não mapeada: '+fn,'error'); if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar'; } return; }
  var endpoint = mapeamento[0], method = mapeamento[1];
  api(method, endpoint, dados)
    .then(function(res){
      if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar'; }
      if(res.sucesso){
        fecharModal(modalId); toast(res.mensagem,'success');
        recarregarDadosEAtualizar(tbodyId,renderFn,cacheKey);
      } else {
        var msgEl=document.getElementById('formMsg');
        if(msgEl) msgEl.innerHTML='<p class="text-sm text-red">'+esc(res.mensagem)+'</p>';
      }
    })
    .catch(function(e){
      if(btn){ btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i>Salvar'; }
      var msgEl=document.getElementById('formMsg');
      if(msgEl) msgEl.innerHTML='<p class="text-sm text-red">Erro: '+esc(e)+'</p>';
    });
}

function recarregarDadosEAtualizar(tbodyId,renderFn,cacheKey){
  var endpoint = _CACHE_ENDPOINT[cacheKey];
  if(!endpoint){ return; }
  api('GET', L(endpoint))
    .then(function(novos){
      if(ST.dados&&cacheKey) {
        ST.dados[cacheKey] = (cacheKey === 'itensFixos' && !Array.isArray(novos)) ? (novos.prontos || []) : novos;
      }
      var tbody=document.getElementById(tbodyId);
      if(tbody&&renderFn) tbody.innerHTML=renderFn();
    })
    .catch(function(){});
}

function confirmarExcluir(aba,id,nome,fn){
  // Otimização: Previne vazamento de memória limpando modais zumbis anteriores
  var oldOverlay = document.getElementById('confirmOverlayExcluir');
  if(oldOverlay) oldOverlay.remove();
  
  var overlay=document.createElement('div');
  overlay.id = 'confirmOverlayExcluir';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px 32px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">'
    +'<div style="width:48px;height:48px;background:#fef2f2;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><i class="fa-solid fa-trash" style="color:#ef4444;font-size:20px"></i></div>'
    +'<p style="font-weight:800;font-size:16px;color:#1e1b4b;margin-bottom:8px">Confirmar exclusão</p>'
    +'<p style="font-size:13px;color:#6b7280;margin-bottom:24px">Excluir <strong>'+esc(nome)+'</strong>?<br>Esta ação não pode ser desfeita.</p>'
    +'<div style="display:flex;gap:10px;justify-content:center">'
    +'<button id="_cancelDel" style="padding:10px 20px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;font-weight:700;cursor:pointer;font-family:inherit">Cancelar</button>'
    +'<button id="_confirmDel" style="padding:10px 20px;border-radius:10px;border:none;background:#ef4444;color:#fff;font-weight:700;cursor:pointer;font-family:inherit">Excluir</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('_cancelDel').onclick=function(){ document.body.removeChild(overlay); };
  document.getElementById('_confirmDel').onclick=function(){
    document.body.removeChild(overlay);
    var mapDel = _FN_MAP[fn];
    if(!mapDel){ toast('Função não mapeada: '+fn,'error'); return; }
    api('DELETE', mapDel[0] + '/' + encodeURIComponent(id))
      .then(function(res){
        if(res.sucesso){
          toast('Excluído com sucesso!','success');
          if(ST.abaAtiva==='abaMonteAcai')       recarregarMonteAcai();
          else if(ST.abaAtiva==='abaItens')       recarregarItens();
          else if(ST.abaAtiva==='abaPedidos')     recarregarPedidosDia();
          else if(ST.abaAtiva==='abaDelivery')    recarregarDelivery();
          else if(ST.abaAtiva==='abaRelatorios')  carregarRelatorio();
          else if(ST.abaAtiva==='abaConfig')      recarregarConfig();
          else navegarPara(ST.abaAtiva);
        } else toast(res.mensagem,'error');
      })
      .catch(function(e){ toast('Erro: '+e,'error'); });
  };
}

var _dragSrcMod = null;
function dragStartMod(e) {
  _dragSrcMod = e.currentTarget;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/html', _dragSrcMod.innerHTML);
  e.currentTarget.style.opacity = '0.5';
}
function dragOverMod(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
function dragEndMod(e) { e.currentTarget.style.opacity = '1'; }
function dropMod(e) {
  e.stopPropagation(); e.preventDefault();
  var tr = e.target.closest('tr');
  if (_dragSrcMod && tr && _dragSrcMod !== tr) {
    var tbody = tr.parentNode;
    var items = Array.from(tbody.querySelectorAll('tr'));
    var fromIdx = items.indexOf(_dragSrcMod);
    var toIdx = items.indexOf(tr);
    if(fromIdx < toIdx) tbody.insertBefore(_dragSrcMod, tr.nextSibling);
    else tbody.insertBefore(_dragSrcMod, tr);
    salvarOrdemModelos();
  }
  return false;
}
function salvarOrdemModelos() {
  var rows = document.querySelectorAll('#tbodyModelos tr[data-id]');

  rows.forEach(function(row) {
    var id = row.getAttribute('data-id');

    if(mod && parseInt(mod.ordem) !== ordemAtual) {
      mod.ordem = ordemAtual;
      promessas.push(api('POST', L('/acai-modelos'), mod));
    }
    ordemAtual++;

  if(promessas.length > 0) {
     toast('Salvando nova ordem...', 'warn');

        toast('Ordem dos tamanhos atualizada!', 'success');

}

function abrirFormModelo(id){
  var d=id?((ST.dados&&ST.dados.acaiModelos)||[]).find(function(x){ return x.id_modelo===id; }):null;
  var cats=(ST.dados&&ST.dados.acaiCategorias)||[];

  // Parse Limites_JSON existente para pré-preencher
  var limitesAtual={};
  if(d&&d.limites_json){
    try{
      var parsed=JSON.parse(d.limites_json);
      Object.keys(parsed).forEach(function(k){
        var v=parsed[k];
        if(typeof v==='object'&&v!==null){ limitesAtual[k.toLowerCase()]={min:parseInt(v.min||0),max:parseInt(v.max||99)}; }
        else{ limitesAtual[k.toLowerCase()]={min:0,max:parseInt(v)||99}; }
      });
    }catch(e){}
  }

  var tabelaCats='';
  if(cats.length===0){
    tabelaCats='<div style="padding:12px;background:#fef9c3;border:1px solid #fde047;border-radius:10px;font-size:12px;color:#854d0e;font-weight:600;">'
      +'<i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i>'
      +'Nenhuma categoria cadastrada. Crie em <strong>Monte A&ccedil;a&iacute; &rarr; Categorias</strong> primeiro.</div>';
  } else {
    tabelaCats=
      '<div style="border:1.5px solid #e9d5ff;border-radius:14px;overflow:hidden;margin-top:4px">'
      +'<div style="display:grid;grid-template-columns:1fr 110px 110px;background:#f5f3ff;padding:8px 14px;border-bottom:1px solid #e9d5ff">'
      +'<span style="font-size:11px;font-weight:800;color:#6b21a8;text-transform:uppercase;letter-spacing:.4px">Categoria</span>'
      +'<span style="font-size:11px;font-weight:800;color:#6b21a8;text-transform:uppercase;letter-spacing:.4px;text-align:center">M\u00ednimo</span>'
      +'<span style="font-size:11px;font-weight:800;color:#6b21a8;text-transform:uppercase;letter-spacing:.4px;text-align:center">M\u00e1ximo</span>'
      +'</div>';
    cats.forEach(function(cat,idx){
      var nomeCat=cat.nome||cat.nome||'';
      var chave=nomeCat.toLowerCase();
      var limCat=limitesAtual[chave]||{min:0,max:99};
      var maxVal=limCat.max===99?'':limCat.max;
